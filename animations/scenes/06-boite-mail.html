<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toumaï — La boîte qui se vide</title>
  <link rel="stylesheet" href="../commun/scene.css" />
  <style>
    /* L'écriture manuscrite.
     *
     * Caveat, figée au poids 500 et réduite aux signes que le stylo peut
     * tracer : 21 Ko servis depuis notre domaine. La pile générique `cursive`
     * donnait trois écritures différentes sur trois systèmes, et rien du tout
     * de manuscrit sur plusieurs Android.
     *
     * Caveat — SIL Open Font License 1.1, licence recopiée dans
     * `commun/polices/OFL.txt`. Fabriquée par
     * `outils/fabriquer_police_manuscrite.py`. */
    @font-face {
      font-family: "Manuscrite";
      src: url("../commun/polices/caveat-500.woff2") format("woff2");
      font-weight: 500;
      font-display: swap;
    }

    /* Cette scène-ci est claire, là où les autres sont sombres. Ce n'est pas
     * une fantaisie : c'est la seule qui montre un poste de travail, et un
     * poste de travail est éclairé. */
    .scene {
      background: linear-gradient(150deg, #f2e7da 0%, #e9dbca 58%, #e3d1bd 100%);
    }

    .objet {
      font: 600 26px/1 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      fill: #17130f;
      letter-spacing: -.01em;
    }

    .question {
      font: 400 21px/1 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      fill: #5c4f42;
    }

    /* La réponse. Plus grande que le texte imprimé : une écriture manuscrite
     * à la taille d'un corps de texte se lit comme une police fantaisie, pas
     * comme une main. */
    .reponse {
      font: 500 42px/1 "Manuscrite", "Segoe Script", cursive;
      fill: #22303f;
    }

    .etiquette {
      font: 600 12px/1 Inter, ui-sans-serif, system-ui, sans-serif;
      letter-spacing: .13em;
      text-transform: uppercase;
      fill: #a0937f;
    }

    .demande {
      font: 650 22px/1 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      fill: #17130f;
    }

    .puce {
      font: 600 17px/1 Inter, ui-sans-serif, system-ui, "Segoe UI", sans-serif;
      text-anchor: middle;
    }

    /* La main qui ecrit : contour sombre, chair claire. Le rapport des deux
     * epaisseurs (26 et 17) donne un liser de 4,5 unites de chaque cote —
     * assez pour separer deux doigts qui se chevauchent, assez fin pour ne
     * pas alourdir le trait. */
    .doigt .contour,
    .doigt .chair {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .doigt .contour { stroke: #241d18; stroke-width: 26; }
    .doigt .chair   { stroke: #fdf7ee; stroke-width: 17; }

    /* L avant-bras est plus epais qu un doigt, et le liser reste le meme. */
    .bras .contour,
    .bras .chair { fill: none; stroke-linecap: round; }
    .bras .contour { stroke: #241d18; stroke-width: 62; }
    .bras .chair   { stroke: #fdf7ee; stroke-width: 53; }

    /* L'anneau qui respire autour de « Envoyer » : le seul mouvement qui reste
     * pendant que la carte attend, et il dit la seule chose qui compte —
     * ça attend quelqu'un. */
    #attente {
      animation: attendre 1.9s ease-in-out infinite;
      transform-origin: 1014px 559px;
    }
    @keyframes attendre {
      0%, 100% { opacity: 0; transform: scale(.9); }
      45%      { opacity: .6; transform: scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      #attente { animation: none; opacity: .45; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="titre-scene desc-scene">
      <title id="titre-scene">Toumaï répond à trois courriels et attend l’accord avant chaque envoi</title>
      <desc id="desc-scene">
        Un bureau. À gauche, un bac contenant trois lettres ; en dessous, un bac
        de courrier traité. À droite, une feuille de travail. Pour chacune des
        trois lettres, une main la prend, l’ouvre, et la question s’affiche :
        un report de rendez-vous, une facture, un devis. La main saisit alors un
        stylo et écrit la réponse à la main, mot après mot. Une carte demande
        « Envoyer ? » ; la main appuie sur le bouton, un avion de papier
        s’envole, et la lettre rejoint le bac du courrier traité.
      </desc>

      <defs>
        <linearGradient id="bac-creux" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#dcc7ae" />
          <stop offset="1" stop-color="#e8d8c5" />
        </linearGradient>
        <linearGradient id="bac-levre" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d9c2a7" />
          <stop offset="1" stop-color="#c7ab8c" />
        </linearGradient>
        <linearGradient id="papier" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fffdf9" />
          <stop offset="1" stop-color="#fbf5ec" />
        </linearGradient>

        <filter id="ombre-douce" x="-25%" y="-25%" width="150%" height="160%">
          <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#6b4527"
                        flood-opacity=".18" />
        </filter>
        <filter id="ombre-carte" x="-25%" y="-40%" width="150%" height="200%">
          <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6b4527"
                        flood-opacity=".22" />
        </filter>

        <radialGradient id="vignette" cx="50%" cy="44%" r="76%">
          <stop offset="60%" stop-color="#000" stop-opacity="0" />
          <stop offset="100%" stop-color="#4a2c18" stop-opacity=".16" />
        </radialGradient>

        <!-- L'encre. La réponse est posée en entier dès le départ, invisible,
             et ce rectangle la découvre de gauche à droite pendant que la
             pointe avance sur la même abscisse. C'est ce qui sépare une
             écriture d'un texte qui apparaît : les lettres sortent du trait,
             elles ne surgissent pas entières. -->
        <!-- LES DOIGTS DE LA MAIN QUI ECRIT.
             Chaque doigt est un trace unique, dessine deux fois : epais et
             sombre pour le contour, plus fin et clair pour la chair. Deux
             `use` sur un seul `path` — la geometrie n existe qu a un endroit.
             Le repere est celui du stylo : l origine est la POINTE, l axe des
             x suit le corps. La main placee avec les memes arguments que le
             stylo le tient donc forcement juste. -->
        <path id="d-index"       d="M150 -20 C 116 -24, 78 -20, 46 -8" />
        <path id="d-majeur"      d="M160 28 C 122 18, 86 14, 56 22" />
        <path id="d-annulaire"   d="M166 60 C 130 50, 96 48, 70 58" />
        <path id="d-auriculaire" d="M170 90 C 142 82, 112 82, 90 94" />
        <path id="d-pouce"       d="M140 66 C 110 56, 82 38, 62 14" />
        <path id="d-bras"        d="M196 76 C 268 132, 338 192, 410 264" />

        <clipPath id="encre">
          <rect id="encre-cache" x="522" y="370" width="0" height="72" />
        </clipPath>
      </defs>

      <!-- ── LA FEUILLE DE TRAVAIL ───────────────────────────────────────── -->
      <g filter="url(#ombre-douce)">
        <rect x="496" y="92" width="628" height="524" rx="20"
              fill="url(#papier)" stroke="#e7d9c7" stroke-width="1.5" />
      </g>

      <!-- Le message reçu : son objet, et la question, en toutes lettres. Des
           barres grises à la place du texte ne se comprennent pas ; on montre
           la conversation, sinon la scène ne prouve rien. -->
      <g id="message" opacity="0">
        <text id="objet" class="objet" x="650" y="150"></text>
        <text class="etiquette" x="650" y="178">Message reçu</text>
        <line x1="528" y1="212" x2="1092" y2="212" stroke="#efe3d4" stroke-width="1.5" />
        <text id="question" class="question" x="528" y="258"></text>
        <rect x="528" y="286" width="240" height="9" rx="4.5" fill="#efe4d6" />
      </g>

      <!-- La réponse, écrite à la main -->
      <g id="bloc-reponse" opacity="0">
        <text class="etiquette" x="528" y="344">Réponse de Toumaï</text>
        <text id="reponse" class="reponse" x="528" y="416" clip-path="url(#encre)"></text>
      </g>

      <!-- ── LES BACS ─────────────────────────────────────────────────────
           Les lettres sont dessinées ENTRE le creux et la lèvre : c'est ce
           chevauchement, et rien d'autre, qui fait qu'elles sont « dans » le
           bac et non posées dessus. -->
      <ellipse cx="254" cy="332" rx="170" ry="14" fill="#6b4527" opacity=".13" />
      <rect x="96" y="176" width="316" height="132" rx="12" fill="url(#bac-creux)" />

      <g id="lettres">
        <g id="env-3">
          <rect x="0" y="0" width="132" height="88" rx="7" fill="#fdf4e8"
                stroke="#d8c0a4" stroke-width="2" />
          <path class="rabat" d="M0 6 L66 50 L132 6 Z" fill="#f0dcc4"
                stroke="#d8c0a4" stroke-width="2" />
        </g>
        <g id="env-2">
          <rect x="0" y="0" width="132" height="88" rx="7" fill="#fdf4e8"
                stroke="#d8c0a4" stroke-width="2" />
          <path class="rabat" d="M0 6 L66 50 L132 6 Z" fill="#f0dcc4"
                stroke="#d8c0a4" stroke-width="2" />
        </g>
        <g id="env-1">
          <rect x="0" y="0" width="132" height="88" rx="7" fill="#fdf4e8"
                stroke="#d8c0a4" stroke-width="2" />
          <path class="rabat" d="M0 6 L66 50 L132 6 Z" fill="#f0dcc4"
                stroke="#d8c0a4" stroke-width="2" />
        </g>
      </g>

      <rect x="96" y="286" width="316" height="36" rx="12" fill="url(#bac-levre)" />

      <ellipse cx="254" cy="600" rx="170" ry="14" fill="#6b4527" opacity=".13" />
      <rect x="96" y="444" width="316" height="132" rx="12" fill="url(#bac-creux)" />
      <g id="traitees"></g>
      <rect x="96" y="554" width="316" height="36" rx="12" fill="url(#bac-levre)" />

      <!-- ── LA CARTE DE CONFIRMATION ─────────────────────────────────────
           C'est elle qui justifie la scène. Le reste montre que Toumaï sait
           faire ; celle-ci montre qu'il attend qu'on le lui dise. -->
      <g id="carte" opacity="0">
        <g filter="url(#ombre-carte)">
          <rect x="520" y="516" width="580" height="86" rx="16" fill="#fffdf9"
                stroke="#e6d2bd" stroke-width="1.5" />
        </g>
        <text class="demande" x="552" y="566">Envoyer&#160;?</text>

        <rect x="812" y="538" width="124" height="42" rx="21" fill="none"
              stroke="#d9c6b0" stroke-width="1.6" />
        <text class="puce" x="874" y="565" fill="#6b5b4a">Modifier</text>

        <circle id="attente" cx="1014" cy="559" r="30" fill="none"
                stroke="#d97857" stroke-width="2" />
        <g id="bouton-envoyer">
          <rect x="952" y="538" width="124" height="42" rx="21" fill="#d97857" />
          <text class="puce" x="1014" y="565" fill="#fff8ef">Envoyer</text>
        </g>
      </g>

      <!-- ── L'ENVOI ──────────────────────────────────────────────────────
           Le sillage se trace d'abord, l'avion le suit. L'inverse — l'avion
           puis sa trace — donne un objet qui glisse ; celui-ci vole. -->
      <path id="sillage" d="M1014 544 C 1078 484, 1140 430, 1252 366"
            fill="none" stroke="#d97857" stroke-width="2.5"
            stroke-linecap="round" opacity="0" />
      <g id="avion" opacity="0">
        <!-- Deux ailes de tons differents : c est le pli central qui fait la
             difference entre un avion de papier et une pointe de fleche. -->
        <path d="M23 0 L-18 -15 L-5 0 Z" fill="#e8926f" />
        <path d="M23 0 L-18 15 L-5 0 Z" fill="#c0573a" />
        <path d="M23 0 L-5 0" fill="none" stroke="#a8482c" stroke-width="1.6" />
      </g>

      <!-- ── LES MAINS ────────────────────────────────────────────────────
           Deux mains, parce qu'une main ne fait pas deux choses de la même
           façon : celle qui prend une lettre et appuie sur un bouton a l'index
           tendu ; celle qui écrit tient le stylo entre le pouce et l'index,
           les autres doigts repliés. La première est l'image partagée par
           toutes les scènes ; la seconde est tracée ici, au trait, dans la
           même écriture graphique. Elle passera dans le socle commun le jour
           où une deuxième scène en aura besoin. -->
      <g id="main" class="main">
        <g transform="translate(238 0) scale(-1 1)">
          <image x="0" y="0" width="238" height="275" preserveAspectRatio="none"
                 href="../commun/mains/main-1.webp" />
        </g>
      </g>

      <!-- La main qui écrit. Son origine locale est posée sur la POINTE du
           stylo et son axe des x suit le corps du stylo : placée avec les
           mêmes arguments que le stylo, elle le tient forcément juste. Les
           doigts se referment autour de x = 62, là où on tient un stylo. -->
      <g id="main-stylo" class="main" opacity="0">
        <g transform="scale(1.02)">
          <!-- L avant-bras, sous tout le reste. -->
          <g class="bras"><use href="#d-bras" class="contour" /><use href="#d-bras" class="chair" /></g>
          <!-- Les doigts replies, du plus loin au plus proche : chacun est
               trace deux fois, une fois epais et sombre, une fois plus fin et
               clair. C est ce liser qui separe deux doigts qui se chevauchent ;
               sans lui, une main fermee est une masse. -->
          <g class="doigt"><use href="#d-auriculaire" class="contour" /><use href="#d-auriculaire" class="chair" /></g>
          <g class="doigt"><use href="#d-annulaire" class="contour" /><use href="#d-annulaire" class="chair" /></g>
          <g class="doigt"><use href="#d-majeur" class="contour" /><use href="#d-majeur" class="chair" /></g>
          <!-- Le dos de la main -->
          <path d="M134 -24 C 174 -22, 204 2, 214 40
                   C 224 80, 212 114, 178 122
                   C 144 130, 118 110, 114 74
                   C 110 38, 114 -12, 134 -24 Z"
                fill="#fdf7ee" stroke="#241d18" stroke-width="9"
                stroke-linejoin="round" />
          <!-- L index, POSE sur le corps du stylo et dirige vers la pointe :
               c est lui qui dit que la main ecrit et ne pousse pas. -->
          <g class="doigt"><use href="#d-index" class="contour" /><use href="#d-index" class="chair" /></g>
          <!-- Le pouce, au premier plan, qui pince le stylo juste derriere
               la pointe. -->
          <g class="doigt"><use href="#d-pouce" class="contour" /><use href="#d-pouce" class="chair" /></g>
        </g>
      </g>

      <!-- ── LE STYLO ─────────────────────────────────────────────────────
           Dessiné pointe à l'origine : tout le geste se calcule depuis la
           pointe, qui est le seul point qui doit tomber juste. -->
      <g id="stylo">
        <path d="M0 0 L15 -6 L15 6 Z" fill="#c25b3c" />
        <rect x="14" y="-5.5" width="104" height="11" rx="5.5" fill="#2a211b" />
        <rect x="92" y="-5.5" width="26" height="11" rx="5.5" fill="#c25b3c" />
      </g>

      <rect x="0" y="0" width="1200" height="720" fill="url(#vignette)"
            pointer-events="none" />
    </svg>
  </main>

  <script src="../commun/scene.js"></script>
  <script>
    (() => {
      "use strict";
      const S = window.Scene;

      const message = S.el("message");
      const objet = S.el("objet");
      const question = S.el("question");
      const blocReponse = S.el("bloc-reponse");
      const reponse = S.el("reponse");
      const encre = S.el("encre-cache");
      const carte = S.el("carte");
      const bouton = S.el("bouton-envoyer");
      const attente = S.el("attente");
      const stylo = S.el("stylo");
      const mainStylo = S.el("main-stylo");
      const avion = S.el("avion");
      const sillage = S.el("sillage");
      const traitees = S.el("traitees");

      /** Où la lettre ouverte se pose sur la feuille de travail. */
      const SUR_FEUILLE = { x: 528, y: 112 };
      const ECHELLE_LUE = 0.74;

      /** Le stylo au repos, posé sur le bureau à droite. */
      // Pose au bas de la feuille, PAS sous le bouton : a sa place
      // precedente (952, 664) il se retrouvait sous la main qui appuie
      // sur « Envoyer », et on croyait qu'elle cliquait avec le stylo.
      const STYLO_REPOS = { x: 624, y: 672 };

      /** L'angle du stylo pendant qu'il écrit. */
      const ANGLE_ECRITURE = -34;

      /** Le début de la ligne manuscrite, et sa ligne de base. */
      const X_TEXTE = 528;
      const Y_TEXTE = 416;

      /**
       * Trois courriers, trois sujets, trois réponses. Ce sont trois vraies
       * conversations : une question compréhensible, une réponse qui y répond.
       * Une scène où une main s'agite au-dessus d'un texte illisible ne prouve
       * rien du tout.
       */
      const COURRIERS = [
        {
          id: "env-1",
          repos: { x: 178, y: 194 },
          bac: { x: 132, y: 508 },
          objet: "Rendez-vous jeudi",
          question: "Bonjour, pouvons-nous décaler à jeudi 15 h ?",
          reponse: "Jeudi 15 h me convient.",
        },
        {
          id: "env-2",
          repos: { x: 152, y: 212 },
          bac: { x: 176, y: 480 },
          objet: "Facture 2026-03",
          question: "La facture de mars est-elle réglée ?",
          reponse: "Réglée le 28 février.",
        },
        {
          id: "env-3",
          repos: { x: 126, y: 230 },
          bac: { x: 148, y: 456 },
          objet: "Devis boutique",
          question: "Quel délai pour 40 sacs brodés ?",
          reponse: "Dix jours ouvrés.",
        },
      ];

      const main = S.Main({
        id: "main",
        echelle: 0.84,
        grip: { x: 58, y: 69 },
        repos: { x: 1210, y: 470 },
      });

      /* ─── PRIMITIVES ──────────────────────────────────────────────────── */

      /** Le rabat d'une lettre, entre 1 (fermé) et -1 (relevé). */
      function rabatA(lettre, sy) {
        lettre.querySelector(".rabat").setAttribute(
          "transform",
          "translate(0 " + (6 - 6 * sy).toFixed(2) + ") scale(1 " + sy.toFixed(3) + ")"
        );
      }

      /** La main ouverte tient la lettre par son bord supérieur. */
      function tenir(point, echelle) {
        main.poser(main.pourToucher({ x: point.x + 66 * echelle, y: point.y + 12 }));
      }

      /** Le stylo ET la main qui le tient, d'un seul geste. */
      function styloA(pointe, angle) {
        S.place(stylo, pointe, 1, angle);
        S.place(mainStylo, pointe, 1, angle);
      }

      /** Passe d'une main à l'autre en fondu. */
      async function echangerMains(versLeStylo, duree) {
        await S.tween(duree === undefined ? 170 : duree, (t) => {
          S.opacite(mainStylo, versLeStylo ? t : 1 - t);
          S.opacite(main.noeud, versLeStylo ? 1 - t : t);
        });
      }

      /* ─── LES GESTES ──────────────────────────────────────────────────── */

      async function prendre(courrier) {
        await main.aller({ x: courrier.repos.x + 66, y: courrier.repos.y + 12 }, 480, 32);
        await main.serrer(110);
      }

      async function porter(noeud, depart, duree) {
        await S.tween(duree, (t) => {
          const p = {
            x: S.entre(depart.x, SUR_FEUILLE.x, t),
            y: S.entre(depart.y, SUR_FEUILLE.y, t) - Math.sin(Math.PI * t) * 64,
          };
          const e = S.entre(1, ECHELLE_LUE, t);
          S.place(noeud, p, e);
          tenir(p, e);
        });
      }

      async function ouvrir(noeud, duree) {
        await S.tween(duree, (t) => rabatA(noeud, S.entre(1, -1, t)), S.courbes.freine);
      }

      async function afficherLeMessage(courrier, duree) {
        objet.textContent = courrier.objet;
        question.textContent = courrier.question;
        await S.tween(duree, (t) => S.opacite(message, t));
      }

      /**
       * L'écriture.
       *
       * Le texte est posé en entier, masqué, et le rectangle d'encre le
       * découvre pendant que la pointe avance sur la même abscisse. La cadence
       * suit la LARGEUR réellement rendue, pas le nombre de lettres : « lll »
       * et « mmm » ne prennent pas le même temps à écrire, et l'œil le sait.
       * Entre deux mots, la main s'arrête un instant — c'est là qu'on lève le
       * stylo.
       */
      async function ecrireAlaMain(texte, vitesse) {
        reponse.textContent = texte;
        encre.setAttribute("x", String(X_TEXTE - 6));
        encre.setAttribute("y", String(Y_TEXTE - 46));
        encre.setAttribute("height", "72");
        encre.setAttribute("width", "0");

        if (S.mouvementReduit) {
          encre.setAttribute("width", "640");
          return;
        }

        const bornes = [];
        for (let i = 0; i < texte.length; i += 1) {
          if (texte[i] === " " || i === texte.length - 1) {
            bornes.push(reponse.getSubStringLength(0, i + 1));
          }
        }

        let precedent = 0;
        for (const borne of bornes) {
          const largeur = borne - precedent;
          await S.tween(Math.max(150, largeur * vitesse), (t) => {
            const avance = S.entre(precedent, borne, t);
            encre.setAttribute("width", (avance + 6).toFixed(1));
            // Le léger balancement : une main n'écrit pas sur un rail.
            styloA({
              x: X_TEXTE + avance + 4,
              y: Y_TEXTE + 8 + Math.sin(t * Math.PI * 2.6) * 2.2,
            }, ANGLE_ECRITURE + Math.sin(t * Math.PI * 2) * 1.8);
          }, S.courbes.lineaire);
          precedent = borne;
          await S.attendre(80);
        }
      }

      async function prendreLeStylo() {
        await main.aller({ x: STYLO_REPOS.x + 60, y: STYLO_REPOS.y - 10 }, 440, 30);
        await main.serrer(110);
        await echangerMains(true);
        await S.tween(400, (t) => {
          styloA({
            x: S.entre(STYLO_REPOS.x, X_TEXTE + 4, t),
            y: S.entre(STYLO_REPOS.y, Y_TEXTE + 8, t) - Math.sin(Math.PI * t) * 54,
          }, S.entre(-6, ANGLE_ECRITURE, t));
        });
      }

      async function reposerLeStylo(depuis) {
        await S.tween(380, (t) => {
          styloA({
            x: S.entre(depuis, STYLO_REPOS.x, t),
            y: S.entre(Y_TEXTE + 8, STYLO_REPOS.y, t) - Math.sin(Math.PI * t) * 44,
          }, S.entre(ANGLE_ECRITURE, -6, t));
        });
        main.poser(main.pourToucher({ x: STYLO_REPOS.x + 60, y: STYLO_REPOS.y - 10 }));
        await echangerMains(false);
      }

      async function demanderAccord(duree) {
        await S.tween(duree, (t) => {
          S.place(carte, { x: 0, y: S.entre(52, 0, t) });
          S.opacite(carte, t);
        }, S.courbes.freine);
      }

      /** La main appuie. Le bouton s'enfonce, l'anneau d'attente s'éteint. */
      async function appuyer(duree) {
        await main.aller({ x: 1014, y: 594 }, duree, 26);
        await S.tween(160, (t) => {
          const e = 1 - 0.07 * Math.sin(Math.PI * t);
          bouton.setAttribute(
            "transform",
            "translate(1014 559) scale(" + e.toFixed(3) + ") translate(-1014 -559)"
          );
          main.poser(main.pourToucher({ x: 1014, y: 594 + 6 * Math.sin(Math.PI * t) }));
        });
        attente.style.setProperty("display", "none");
      }

      /** L'envoi : le sillage se trace, l'avion le suit et sort du cadre. */
      async function envoyer() {
        const longueur = sillage.getTotalLength();
        sillage.style.setProperty("stroke-dasharray", String(longueur));
        sillage.style.setProperty("stroke-dashoffset", String(longueur));
        S.opacite(sillage, 0.7);
        S.opacite(avion, 1);

        await S.tween(880, (t) => {
          sillage.style.setProperty("stroke-dashoffset", String(longueur * (1 - t)));
          const p = sillage.getPointAtLength(longueur * t);
          const q = sillage.getPointAtLength(Math.min(longueur, longueur * t + 6));
          const angle = (Math.atan2(q.y - p.y, q.x - p.x) * 180) / Math.PI;
          S.place(avion, p, S.entre(1.5, 1.05, t), angle);
          if (t > 0.86) S.opacite(avion, 1 - (t - 0.86) / 0.14);
        }, S.courbes.freine);

        await S.attendre(180);
        await S.tween(320, (t) => S.opacite(sillage, 0.7 * (1 - t)));
      }

      /** La lettre rejoint le bac du courrier traité. */
      async function ranger(courrier, noeud, duree) {
        await S.tween(duree, (t) => {
          const p = {
            x: S.entre(SUR_FEUILLE.x, courrier.bac.x, t),
            y: S.entre(SUR_FEUILLE.y, courrier.bac.y, t) - Math.sin(Math.PI * t) * 122,
          };
          S.place(noeud, p, S.entre(ECHELLE_LUE, 1, t));
          if (t > 0.3) rabatA(noeud, S.entre(-1, 1, Math.min(1, (t - 0.3) / 0.5)));
          S.opacite(message, Math.max(0, 1 - t * 2.6));
          S.opacite(blocReponse, Math.max(0, 1 - t * 2.6));
          S.opacite(carte, Math.max(0, 1 - t * 3));
        });
        traitees.appendChild(noeud);
      }

      /** Remet en place ce que l'envoi a consommé, avant le courrier suivant. */
      function rearmer() {
        bouton.removeAttribute("transform");
        attente.style.removeProperty("display");
        S.place(carte, { x: 0, y: 52 });
        S.opacite(carte, 0);
        S.opacite(avion, 0);
        S.opacite(sillage, 0);
        sillage.style.removeProperty("stroke-dasharray");
        sillage.style.removeProperty("stroke-dashoffset");
      }

      /* ─── LA SCÈNE ────────────────────────────────────────────────────── */

      function preparer() {
        COURRIERS.forEach((c) => {
          const noeud = S.el(c.id);
          S.place(noeud, c.repos, 1);
          S.opacite(noeud, 1);
          rabatA(noeud, 1);
        });
        // Réempilées dans l'ordre du dessin : la première du tableau doit être
        // au-dessus, donc dessinée en dernier.
        S.el("lettres").append(...COURRIERS.map((c) => S.el(c.id)).reverse());

        rearmer();
        S.opacite(message, 0);
        S.opacite(blocReponse, 0);
        S.opacite(mainStylo, 0);
        S.opacite(main.noeud, 1);
        objet.textContent = "";
        question.textContent = "";
        reponse.textContent = "";
        encre.setAttribute("width", "0");
        styloA(STYLO_REPOS, -6);
        main.poser(main.pourToucher({ x: 1290, y: 520 }));
      }

      /** L'état final, pour qui a demandé moins de mouvement : la boîte vide,
       *  les trois lettres traitées, la dernière conversation à l'écran. */
      function finFixe() {
        const dernier = COURRIERS[COURRIERS.length - 1];
        COURRIERS.forEach((c) => {
          const noeud = S.el(c.id);
          traitees.appendChild(noeud);
          S.place(noeud, c.bac, 1);
          rabatA(noeud, 1);
        });
        const noeudDernier = S.el(dernier.id);
        S.place(noeudDernier, SUR_FEUILLE, ECHELLE_LUE);
        rabatA(noeudDernier, -1);

        objet.textContent = dernier.objet;
        question.textContent = dernier.question;
        reponse.textContent = dernier.reponse;
        encre.setAttribute("x", String(X_TEXTE - 6));
        encre.setAttribute("y", String(Y_TEXTE - 46));
        encre.setAttribute("height", "72");
        encre.setAttribute("width", "640");

        S.opacite(message, 1);
        S.opacite(blocReponse, 1);
        S.opacite(carte, 1);
        S.place(carte, { x: 0, y: 0 });
        S.opacite(mainStylo, 0);
        S.opacite(main.noeud, 1);
        styloA(STYLO_REPOS, -6);
        main.poser(main.pourToucher({ x: 1290, y: 520 }));
      }

      const scene = S.jouer({
        preparer,
        finFixe,
        pause: 1800,
        async sequence(annulee) {
          await S.attendre(340);

          for (let i = 0; i < COURRIERS.length; i += 1) {
            const courrier = COURRIERS[i];
            const noeud = S.el(courrier.id);
            // Le premier courrier prend son temps : c'est celui qu'on lit. Les
            // suivants vont plus vite — le mécanisme est compris, et trois
            // lectures au même rythme, c'est une scène qui traîne.
            const premier = i === 0;

            await prendre(courrier);
            if (annulee()) return;

            await porter(noeud, courrier.repos, premier ? 520 : 430);
            await ouvrir(noeud, premier ? 300 : 240);
            // La main s'écarte PENDANT que le message s'affiche : posée sur la
            // lettre, elle recouvrait la moitié de la feuille.
            await Promise.all([
              main.aller({ x: 1186, y: 300 }, 340, 14),
              afficherLeMessage(courrier, premier ? 300 : 240),
            ]);
            await S.attendre(premier ? 640 : 400);
            if (annulee()) return;

            S.opacite(blocReponse, 1);
            await prendreLeStylo();
            await ecrireAlaMain(courrier.reponse, premier ? 5.2 : 4.4);
            if (annulee()) return;
            await reposerLeStylo(X_TEXTE + reponse.getComputedTextLength() + 4);

            await demanderAccord(premier ? 380 : 300);
            await S.attendre(premier ? 480 : 300);
            if (annulee()) return;

            await appuyer(premier ? 500 : 420);
            await envoyer();
            if (annulee()) return;

            await ranger(courrier, noeud, 600);
            rearmer();
            if (annulee()) return;
            await S.attendre(200);
          }

          // La boîte est vide : on tient la pose sur le bureau rangé.
          await S.attendre(1100);
        },
      });

      // Un clic relance la scène. Le cadre de l'accueil neutralise les clics ;
      // ouverte seule, la page reste rejouable.
      S.el("scene").addEventListener("click", () => scene.relancer());
      scene.tour();
    })();
  </script>
