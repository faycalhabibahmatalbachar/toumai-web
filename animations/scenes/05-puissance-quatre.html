<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toumaï — Puissance 4 stratégique</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #100e0c;
      --stage-a: #d77a58;
      --stage-b: #c96546;
      --ink: #17130f;
      --ivory: #fff8ef;
      --board: #f1e3d6;
      --hole: #b5563b;
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 42%, #2a201a 0, var(--page) 66%);
    }

    body {
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .stage {
      position: relative;
      width: min(1180px, 96vw);
      aspect-ratio: 5 / 3;
      max-height: 94vh;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 34px;
      background: linear-gradient(145deg, var(--stage-a), var(--stage-b));
      box-shadow: 0 44px 110px rgba(0,0,0,.46), inset 0 1px 0 rgba(255,255,255,.24);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .07;
      background-image: radial-gradient(rgba(255,255,255,.7) .55px, transparent .55px);
      background-size: 6px 6px;
      mix-blend-mode: soft-light;
    }

    svg { display: block; width: 100%; height: 100%; }

    .reserve-slot {
      fill: rgba(75,31,17,.13);
      stroke: rgba(255,255,255,.2);
      stroke-width: 1.5;
    }

    .board-hole {
      fill: var(--hole);
      stroke: rgba(111,47,28,.22);
      stroke-width: 2;
    }

    .token,
    .hand { will-change: transform, opacity; }

    #strategy-halo { opacity: 0; }

    @media (max-width: 760px) {
      body { padding: 8px; }
      .stage { width: 100%; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">Puissance 4 animé entre deux mains stratégiques</title>
      <desc id="scene-desc">Deux mains prennent alternativement des jetons à gauche et à droite, calculent une colonne et les lâchent dans une grille de Puissance 4. Chaque joueur bloque les menaces de l'autre.</desc>

      <defs>
        <filter id="boardShadow" x="-20%" y="-20%" width="140%" height="150%">
          <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#4c2415" flood-opacity=".28" />
        </filter>
        <filter id="pieceShadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4c2415" flood-opacity=".28" />
        </filter>
        <filter id="haloGlow" x="-20%" y="-30%" width="140%" height="160%">
          <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#fff8ef" flood-opacity=".84" />
        </filter>
      </defs>

      <!-- Réserves de six jetons par joueur -->
      <g opacity=".9">
        <rect class="reserve-slot" x="62" y="112" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="164" y="112" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="62" y="286" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="164" y="286" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="62" y="460" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="164" y="460" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="113" y="569" width="82" height="82" rx="26" />

        <rect class="reserve-slot" x="954" y="112" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="1056" y="112" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="954" y="286" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="1056" y="286" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="954" y="460" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="1056" y="460" width="82" height="82" rx="26" />
        <rect class="reserve-slot" x="1005" y="569" width="82" height="82" rx="26" />
      </g>

      <!-- Grille verticale -->
      <g filter="url(#boardShadow)">
        <rect x="338" y="78" width="524" height="570" rx="52" fill="var(--board)" stroke="rgba(255,255,255,.48)" stroke-width="2" />
        <rect x="360" y="100" width="480" height="526" rx="38" fill="rgba(87,38,22,.12)" />

        <g id="holes">
          <!-- Rangée 1 -->
          <circle class="board-hole" cx="390" cy="144" r="29" /><circle class="board-hole" cx="460" cy="144" r="29" /><circle class="board-hole" cx="530" cy="144" r="29" /><circle class="board-hole" cx="600" cy="144" r="29" /><circle class="board-hole" cx="670" cy="144" r="29" /><circle class="board-hole" cx="740" cy="144" r="29" /><circle class="board-hole" cx="810" cy="144" r="29" />
          <!-- Rangée 2 -->
          <circle class="board-hole" cx="390" cy="232" r="29" /><circle class="board-hole" cx="460" cy="232" r="29" /><circle class="board-hole" cx="530" cy="232" r="29" /><circle class="board-hole" cx="600" cy="232" r="29" /><circle class="board-hole" cx="670" cy="232" r="29" /><circle class="board-hole" cx="740" cy="232" r="29" /><circle class="board-hole" cx="810" cy="232" r="29" />
          <!-- Rangée 3 -->
          <circle class="board-hole" cx="390" cy="320" r="29" /><circle class="board-hole" cx="460" cy="320" r="29" /><circle class="board-hole" cx="530" cy="320" r="29" /><circle class="board-hole" cx="600" cy="320" r="29" /><circle class="board-hole" cx="670" cy="320" r="29" /><circle class="board-hole" cx="740" cy="320" r="29" /><circle class="board-hole" cx="810" cy="320" r="29" />
          <!-- Rangée 4 -->
          <circle class="board-hole" cx="390" cy="408" r="29" /><circle class="board-hole" cx="460" cy="408" r="29" /><circle class="board-hole" cx="530" cy="408" r="29" /><circle class="board-hole" cx="600" cy="408" r="29" /><circle class="board-hole" cx="670" cy="408" r="29" /><circle class="board-hole" cx="740" cy="408" r="29" /><circle class="board-hole" cx="810" cy="408" r="29" />
          <!-- Rangée 5 -->
          <circle class="board-hole" cx="390" cy="496" r="29" /><circle class="board-hole" cx="460" cy="496" r="29" /><circle class="board-hole" cx="530" cy="496" r="29" /><circle class="board-hole" cx="600" cy="496" r="29" /><circle class="board-hole" cx="670" cy="496" r="29" /><circle class="board-hole" cx="740" cy="496" r="29" /><circle class="board-hole" cx="810" cy="496" r="29" />
          <!-- Rangée 6 -->
          <circle class="board-hole" cx="390" cy="584" r="29" /><circle class="board-hole" cx="460" cy="584" r="29" /><circle class="board-hole" cx="530" cy="584" r="29" /><circle class="board-hole" cx="600" cy="584" r="29" /><circle class="board-hole" cx="670" cy="584" r="29" /><circle class="board-hole" cx="740" cy="584" r="29" /><circle class="board-hole" cx="810" cy="584" r="29" />
        </g>

        <rect id="strategy-halo" x="348" y="88" width="504" height="550" rx="46" fill="none" stroke="var(--ivory)" stroke-width="5" filter="url(#haloGlow)" />
      </g>

      <!-- Six O à gauche -->
      <g id="o-1" class="token" transform="translate(103 153)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-2" class="token" transform="translate(205 153)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-3" class="token" transform="translate(103 327)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-4" class="token" transform="translate(205 327)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-5" class="token" transform="translate(103 501)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-6" class="token" transform="translate(205 501)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>
      <g id="o-7" class="token" transform="translate(154 610)"><circle r="28" fill="var(--ivory)" /><circle r="11" fill="var(--stage-a)" /></g>

      <!-- Six X à droite -->
      <g id="x-1" class="token" transform="translate(995 153)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-2" class="token" transform="translate(1097 153)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-3" class="token" transform="translate(995 327)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-4" class="token" transform="translate(1097 327)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-5" class="token" transform="translate(995 501)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-6" class="token" transform="translate(1097 501)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>
      <g id="x-7" class="token" transform="translate(1046 610)"><circle r="29" fill="var(--ink)" /><path d="M-12 -12 L12 12 M12 -12 L-12 12" stroke="var(--ivory)" stroke-width="7" stroke-linecap="round" /></g>

      <path id="winning-stroke" d="" fill="none" stroke="var(--ivory)" stroke-width="8" stroke-linecap="round" filter="url(#haloGlow)" opacity="0" />

      <!-- Mains exactes validées -->
      <g id="left-hand" class="hand" transform="translate(-48 476) scale(.84)">
        <image x="0" y="0" width="238" height="275" preserveAspectRatio="none" href="../commun/mains/main-1.webp" />
      </g>

      <g id="right-hand" class="hand" transform="translate(1008 476) scale(.84)">
        <g transform="translate(238 0) scale(-1 1)">
          <image x="0" y="0" width="238" height="275" preserveAspectRatio="none" href="../commun/mains/main-1.webp" />
        </g>
      </g>
    </svg>
  </main>

  <script>
    (() => {
      "use strict";

      const ROWS = 6;
      const COLS = 7;
      const SCALE = .84;
      const columnOrder = [3, 2, 4, 1, 5, 0, 6];
      const columnX = [390, 460, 530, 600, 670, 740, 810];
      const rowY = [144, 232, 320, 408, 496, 584];
      const board = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      const placed = [];

      const sourceList = {
        X: [{x:995,y:153},{x:1097,y:153},{x:995,y:327},{x:1097,y:327},{x:995,y:501},{x:1097,y:501},{x:1046,y:610}],
        O: [{x:103,y:153},{x:205,y:153},{x:103,y:327},{x:205,y:327},{x:103,y:501},{x:205,y:501},{x:154,y:610}]
      };

      const grip = {
        left: { x: 180 * SCALE, y: 69 * SCALE },
        right: { x: 58 * SCALE, y: 69 * SCALE }
      };

      const rest = {
        left: { x: -48, y: 476 },
        right: { x: 1008, y: 476 }
      };

      const hands = {
        left: document.getElementById("left-hand"),
        right: document.getElementById("right-hand")
      };

      const currentHand = { left: { ...rest.left }, right: { ...rest.right } };
      const allTokens = [...document.querySelectorAll(".token")];
      const halo = document.getElementById("strategy-halo");
      const winningStroke = document.getElementById("winning-stroke");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
      const lerp = (a,b,t) => a + (b-a)*t;
      const opponent = player => player === 1 ? 2 : 1;

      function tween(duration, draw) {
        return new Promise(resolve => {
          const start = performance.now();
          function frame(now) {
            const raw = Math.min(1, (now-start)/duration);
            draw(ease(raw), raw);
            if (raw < 1) requestAnimationFrame(frame);
            else resolve();
          }
          requestAnimationFrame(frame);
        });
      }

      function setHand(side, point, scale = SCALE) {
        hands[side].setAttribute("transform", `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) scale(${scale})`);
        currentHand[side] = { ...point };
      }

      function setToken(token, point, scale = 1, rotation = 0) {
        token.setAttribute("transform", `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) rotate(${rotation.toFixed(2)}) scale(${scale.toFixed(3)})`);
      }

      function handPointFor(side, worldPoint) {
        return { x: worldPoint.x-grip[side].x, y: worldPoint.y-grip[side].y };
      }

      async function moveHand(side, destination, duration = 560) {
        const from = { ...currentHand[side] };
        await tween(duration, t => {
          setHand(side, {
            x: lerp(from.x,destination.x,t),
            y: lerp(from.y,destination.y,t) - Math.sin(Math.PI*t)*22
          });
        });
      }

      async function carryToColumn(side, token, source, column) {
        const start = handPointFor(side, source);
        const release = { x: columnX[column], y: 58 };
        const end = handPointFor(side, release);
        setHand(side,start);

        await tween(820, (t,raw) => {
          const arc = Math.sin(Math.PI*t)*62;
          const handPoint = { x:lerp(start.x,end.x,t), y:lerp(start.y,end.y,t)-arc };
          const tokenPoint = { x:handPoint.x+grip[side].x, y:handPoint.y+grip[side].y };
          setHand(side,handPoint,SCALE*(1-Math.sin(Math.PI*raw)*.012));
          setToken(token,tokenPoint,.98,side === "right" ? lerp(-2,1,t) : lerp(2,-1,t));
        });
      }

      async function dropToken(token, column, row) {
        const start = { x:columnX[column], y:58 };
        const end = { x:columnX[column], y:rowY[row] };

        await tween(570, (_t,raw) => {
          const accelerated = raw*raw;
          setToken(token,{x:start.x,y:lerp(start.y,end.y,accelerated)},1,lerp(-1.5,0,raw));
        });

        await tween(170, t => {
          setToken(token,{x:end.x,y:end.y-Math.sin(Math.PI*t)*9},1+Math.sin(Math.PI*t)*.035);
        });
        setToken(token,end);
      }

      async function playDrop(player, tokenIndex, decision) {
        const mark = player === 1 ? "X" : "O";
        const side = player === 1 ? "right" : "left";
        const token = document.getElementById(`${mark.toLowerCase()}-${tokenIndex+1}`);
        const source = sourceList[mark][tokenIndex];

        await moveHand(side,handPointFor(side,source),560);
        await tween(150,t => setHand(side,handPointFor(side,source),SCALE*(1-.018*Math.sin(Math.PI*t))));
        await carryToColumn(side,token,source,decision.column);

        const returnPromise = moveHand(side,rest[side],650);
        await dropToken(token,decision.column,decision.row);
        await returnPromise;

        if (decision.kind === "block") {
          await tween(360,t => setToken(token,{x:columnX[decision.column],y:rowY[decision.row]},1+Math.sin(Math.PI*t)*.12));
        }

        placed.push({ token, column:decision.column, row:decision.row });
        await sleep(120);
      }

      function validColumns() {
        return columnOrder.filter(column => board[0][column] === 0);
      }

      function dropVirtual(column,player) {
        for (let row=ROWS-1; row>=0; row-=1) {
          if (board[row][column] === 0) {
            board[row][column] = player;
            return row;
          }
        }
        return -1;
      }

      function undoVirtual(column) {
        for (let row=0; row<ROWS; row+=1) {
          if (board[row][column] !== 0) {
            board[row][column] = 0;
            return;
          }
        }
      }

      function hasWon(player) {
        for (let row=0; row<ROWS; row+=1) {
          for (let col=0; col<COLS; col+=1) {
            if (col<4 && [0,1,2,3].every(k => board[row][col+k] === player)) return true;
            if (row<3 && [0,1,2,3].every(k => board[row+k][col] === player)) return true;
            if (row<3 && col<4 && [0,1,2,3].every(k => board[row+k][col+k] === player)) return true;
            if (row>=3 && col<4 && [0,1,2,3].every(k => board[row-k][col+k] === player)) return true;
          }
        }
        return false;
      }

      function winningCells(player) {
        for (let row=0; row<ROWS; row+=1) {
          for (let col=0; col<COLS; col+=1) {
            if (col<4 && [0,1,2,3].every(k => board[row][col+k] === player)) return [0,1,2,3].map(k => ({row,col:col+k}));
            if (row<3 && [0,1,2,3].every(k => board[row+k][col] === player)) return [0,1,2,3].map(k => ({row:row+k,col}));
            if (row<3 && col<4 && [0,1,2,3].every(k => board[row+k][col+k] === player)) return [0,1,2,3].map(k => ({row:row+k,col:col+k}));
            if (row>=3 && col<4 && [0,1,2,3].every(k => board[row-k][col+k] === player)) return [0,1,2,3].map(k => ({row:row-k,col:col+k}));
          }
        }
        return [];
      }

      function immediateColumn(player) {
        for (const column of validColumns()) {
          dropVirtual(column,player);
          const wins = hasWon(player);
          undoVirtual(column);
          if (wins) return column;
        }
        return null;
      }

      function windows() {
        const result=[];
        for(let r=0;r<ROWS;r++) for(let c=0;c<4;c++) result.push([0,1,2,3].map(k=>board[r][c+k]));
        for(let c=0;c<COLS;c++) for(let r=0;r<3;r++) result.push([0,1,2,3].map(k=>board[r+k][c]));
        for(let r=0;r<3;r++) for(let c=0;c<4;c++) result.push([0,1,2,3].map(k=>board[r+k][c+k]));
        for(let r=3;r<ROWS;r++) for(let c=0;c<4;c++) result.push([0,1,2,3].map(k=>board[r-k][c+k]));
        return result;
      }

      function evaluate(player) {
        const rival=opponent(player);
        let score=0;
        for(let r=0;r<ROWS;r++) if(board[r][3]===player) score+=5;
        for(const line of windows()) {
          const mine=line.filter(v=>v===player).length;
          const theirs=line.filter(v=>v===rival).length;
          const empty=line.filter(v=>v===0).length;
          if(mine===4) score+=100000;
          else if(mine===3&&empty===1) score+=90;
          else if(mine===2&&empty===2) score+=14;
          if(theirs===3&&empty===1) score-=110;
          else if(theirs===2&&empty===2) score-=12;
        }
        return score;
      }

      function minimax(depth,alpha,beta,maximizing,root) {
        const valid=validColumns();
        if(hasWon(root)) return 1000000+depth;
        if(hasWon(opponent(root))) return -1000000-depth;
        if(depth===0||valid.length===0) return evaluate(root);

        if(maximizing) {
          let value=-Infinity;
          for(const col of valid) {
            dropVirtual(col,root);
            value=Math.max(value,minimax(depth-1,alpha,beta,false,root));
            undoVirtual(col);
            alpha=Math.max(alpha,value);
            if(alpha>=beta) break;
          }
          return value;
        }

        let value=Infinity;
        for(const col of valid) {
          dropVirtual(col,opponent(root));
          value=Math.min(value,minimax(depth-1,alpha,beta,true,root));
          undoVirtual(col);
          beta=Math.min(beta,value);
          if(alpha>=beta) break;
        }
        return value;
      }

      function chooseColumn(player) {
        const winning=immediateColumn(player);
        if(winning!==null) return {column:winning,kind:"win"};
        const blocking=immediateColumn(opponent(player));
        if(blocking!==null) return {column:blocking,kind:"block"};

        let best=-Infinity;
        let column=validColumns()[0];
        for(const candidate of validColumns()) {
          dropVirtual(candidate,player);
          // Même niveau pour les deux camps : lecture tactique + recherche courte.
          const score=minimax(1,-Infinity,Infinity,false,player);
          undoVirtual(candidate);
          if(score>best) { best=score; column=candidate; }
        }
        return {column,kind:"plan"};
      }

      function reset() {
        for(const row of board) row.fill(0);
        placed.length=0;
        setHand("left",rest.left);
        setHand("right",rest.right);
        ["X","O"].forEach(mark => {
          sourceList[mark].forEach((point,index) => {
            const token=document.getElementById(`${mark.toLowerCase()}-${index+1}`);
            token.style.opacity="1";
            setToken(token,point);
          });
        });
        halo.style.opacity="0";
        winningStroke.style.opacity="0";
        winningStroke.setAttribute("d","");
      }

      async function revealWinner(player) {
        const line=winningCells(player);
        if(line.length!==4) return;

        const first=line[0];
        const last=line[3];
        const start={x:columnX[first.col],y:rowY[first.row]};
        const end={x:columnX[last.col],y:rowY[last.row]};
        const length=Math.hypot(end.x-start.x,end.y-start.y);
        winningStroke.setAttribute("d",`M${start.x} ${start.y} L${end.x} ${end.y}`);
        winningStroke.style.strokeDasharray=String(length);
        winningStroke.style.strokeDashoffset=String(length);
        winningStroke.style.opacity="1";

        const winners=placed.filter(item => line.some(cell => cell.row===item.row && cell.col===item.column));
        await tween(620,t => {
          winningStroke.style.strokeDashoffset=String(length*(1-t));
          const pulse=1+Math.sin(Math.PI*t)*.14;
          winners.forEach(({token,column,row}) => setToken(token,{x:columnX[column],y:rowY[row]},pulse));
          halo.style.opacity=String(Math.sin(Math.PI*t)*.72);
        });
        halo.style.opacity=".42";
      }

      async function fadeReset() {
        await tween(500,t => {
          const opacity=String(1-t);
          allTokens.forEach(token => token.style.opacity=opacity);
          halo.style.opacity=opacity;
          winningStroke.style.opacity=opacity;
        });
        reset();
        await sleep(650);
      }

      function staticFinal() {
        const turns=[3,2,3,3,2,2,5,3,5,5,6,4,4];
        for(let index=0;index<turns.length;index+=1) {
          const player=index%2===0?1:2;
          const row=dropVirtual(turns[index],player);
          const mark=player===1?"x":"o";
          setToken(document.getElementById(`${mark}-${Math.floor(index/2)+1}`),{x:columnX[turns[index]],y:rowY[row]});
        }
        const line=winningCells(1);
        if(line.length===4) {
          const first=line[0],last=line[3];
          winningStroke.setAttribute("d",`M${columnX[first.col]} ${rowY[first.row]} L${columnX[last.col]} ${rowY[last.row]}`);
          winningStroke.style.opacity="1";
        }
        halo.style.opacity=".42";
      }

      async function run() {
        reset();
        if(reduceMotion) { staticFinal(); return; }
        await sleep(900);

        while(true) {
          let winner=null;
          for(let turn=0;turn<14;turn+=1) {
            const player=turn%2===0?1:2;
            const decision=chooseColumn(player);
            decision.row=dropVirtual(decision.column,player);
            await playDrop(player,Math.floor(turn/2),decision);
            if(hasWon(player)) {
              winner=player;
              break;
            }
          }
          if(winner!==null) await revealWinner(winner);
          await sleep(2100);
          await fadeReset();
        }
      }

      run();
    })();
  </script>
</body>
</html>
