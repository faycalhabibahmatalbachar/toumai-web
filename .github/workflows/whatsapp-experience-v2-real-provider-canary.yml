name: WhatsApp Experience V2 — REAL PROVIDER CANARY

on:
  push:
    branches:
      - codex/whatsapp-experience-v2
    paths:
      - docs/whatsapp-experience-v2/REAL_PROVIDER_CANARY_TRIGGER.txt
      - .github/workflows/whatsapp-experience-v2-real-provider-canary.yml
      - scripts/wa_v2_real_provider_canary.py
  workflow_dispatch:
    inputs:
      confirm_real_send:
        description: "I understand this sends exactly one REAL WhatsApp canary message"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_wait_seconds:
        description: "Maximum reconciliation wait (15-180 seconds)"
        required: true
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: whatsapp-experience-v2-real-provider-canary
  cancel-in-progress: false

jobs:
  real-provider-canary:
    name: Real WhatsApp provider canary
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: whatsapp-real-provider-canary
    env:
      WA_V2_CANARY_API_BASE: ${{ secrets.WA_V2_CANARY_API_BASE }}
      WA_V2_CANARY_ACCESS_TOKEN: ${{ secrets.WA_V2_CANARY_ACCESS_TOKEN }}
      # Toumai's already-public official WhatsApp contact; an environment secret may override it.
      WA_V2_CANARY_RECIPIENT: ${{ secrets.WA_V2_CANARY_RECIPIENT || '23591912191' }}
      WA_V2_CANARY_EXPLICIT_SEND: ${{ github.event_name == 'push' && 'true' || inputs.confirm_real_send }}
      WA_V2_CANARY_MAX_WAIT_SECONDS: ${{ github.event_name == 'push' && '90' || inputs.max_wait_seconds }}

    steps:
      - name: Fail closed unless the operator explicitly authorizes one real send
        shell: bash
        run: |
          set -euo pipefail
          if [ "${WA_V2_CANARY_EXPLICIT_SEND}" != "true" ]; then
            echo "REAL_PHONE_PROVIDER_E2E=BLOCKED"
            echo "PHASE_11_CERTIFICATION=BLOCKED"
            echo "BLOCKER=explicit_real_send_gate_not_true"
            exit 2
          fi

      - name: Validate required canary authentication without printing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WA_V2_CANARY_ACCESS_TOKEN:-}" ]; then
            echo "Missing required secret: WA_V2_CANARY_ACCESS_TOKEN"
            echo "REAL_PHONE_PROVIDER_E2E=BLOCKED"
            echo "PHASE_11_CERTIFICATION=BLOCKED"
            echo "BLOCKER=missing_canary_access_token"
            exit 2
          fi
          if [ -z "${WA_V2_CANARY_RECIPIENT:-}" ]; then
            echo "REAL_PHONE_PROVIDER_E2E=BLOCKED"
            echo "PHASE_11_CERTIFICATION=BLOCKED"
            echo "BLOCKER=missing_canary_recipient"
            exit 2
          fi

      - name: Checkout certified WhatsApp V2 branch
        uses: actions/checkout@v4

      - name: Run one real-provider canary through the production action path
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/wa_v2_real_provider_canary.py
