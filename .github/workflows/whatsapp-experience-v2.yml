name: WhatsApp Experience V2

on:
  push:
    branches:
      - codex/whatsapp-experience-v2
    paths:
      - "app/dev/whatsapp-ui/**"
      - "components/whatsapp-experience/**"
      - "lib/whatsapp-ui/**"
      - "scripts/verify-whatsapp-experience-v2.mjs"
      - "scripts/e2e_whatsapp_experience_v2.py"
      - "docs/whatsapp-experience-v2/**"
      - ".github/workflows/whatsapp-experience-v2.yml"
  pull_request:
    paths:
      - "app/dev/whatsapp-ui/**"
      - "components/whatsapp-experience/**"
      - "lib/whatsapp-ui/**"
      - "scripts/verify-whatsapp-experience-v2.mjs"
      - "scripts/e2e_whatsapp_experience_v2.py"
      - "docs/whatsapp-experience-v2/**"
      - ".github/workflows/whatsapp-experience-v2.yml"
  workflow_dispatch:

concurrency:
  group: whatsapp-experience-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify WhatsApp Experience contract
        run: node scripts/verify-whatsapp-experience-v2.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: Build static app
        run: npm run build

      - name: Verify visual lab export
        shell: bash
        run: |
          test -f out/dev/whatsapp-ui/index.html
          grep -q "WhatsApp Experience V2" out/dev/whatsapp-ui/index.html
          echo "WHATSAPP_UI_LAB_EXPORT=PASS"

      - name: Install Playwright browser runtime
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Browser E2E — desktop, mobile, keyboard, RTL, reduced motion
        run: python scripts/e2e_whatsapp_experience_v2.py
