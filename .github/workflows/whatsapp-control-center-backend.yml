name: WhatsApp Control Center Backend Contract

on:
  pull_request:
    paths:
      - "app/whatsapp/**"
      - "components/whatsapp/**"
      - "lib/whatsapp-enterprise-api.ts"
      - ".github/workflows/whatsapp-control-center-backend.yml"
  workflow_dispatch:

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout web PR
        uses: actions/checkout@v4
      - name: Checkout backend Phase 2
        uses: actions/checkout@v4
        with:
          repository: faycalhabibahmatalbachar/sayibiai_backend
          ref: codex/whatsapp-control-center-phase2-v2
          path: backend
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Compile Phase 2 backend surface
        working-directory: backend
        run: python -m py_compile routers/whatsapp.py tests/test_whatsapp_control_center_api.py
      - name: Run Phase 2 backend contract tests
        working-directory: backend
        run: python -m pytest -q tests/test_whatsapp_control_center_api.py
