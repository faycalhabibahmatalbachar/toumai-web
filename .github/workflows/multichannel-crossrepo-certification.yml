name: Multichannel cross-repo certification

on:
  push:
    branches:
      - feat/reminder-multichannel-notifications
    paths:
      - ".github/workflows/multichannel-crossrepo-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout backend multichannel branch
        uses: actions/checkout@v4
        with:
          repository: faycalhabibahmatalbachar/sayibiai_backend
          ref: feat/reminder-multichannel-delivery-v2
          path: backend
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pytest croniter python-dateutil
      - name: Syntax
        working-directory: backend
        run: |
          python -m py_compile             routers/notifications.py             routers/preferences.py             services/notification_preferences.py             services/notification_service.py             services/web_push_service.py             services/tools/personal_reminder_notification_tool.py
      - name: Focused backend tests
        working-directory: backend
        run: python -m pytest -q tests/test_reminder_multichannel_notifications.py tests/test_inbox_notifications.py

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout mobile multichannel branch
        uses: actions/checkout@v4
        with:
          repository: faycalhabibahmatalbachar/sayibi-ai
          ref: feat/reminder-multichannel-notifications
          path: mobile
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Generate localizations
        working-directory: mobile
        run: flutter gen-l10n
      - name: Analyze changed notification surfaces
        working-directory: mobile
        run: >-
          flutter analyze --no-fatal-infos
          lib/app.dart
          lib/core/services/notification_service.dart
          lib/core/services/reminder_notification_policy.dart
          lib/features/profile/screens/notifications_screen.dart
      - name: Focused mobile tests
        working-directory: mobile
        run: >-
          flutter test
          test/reminder_notification_policy_test.dart
          test/reminder_notification_integration_contract_test.dart
