name: Zenaba Chatterbox V3 Space Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zenaba-pocket-engine-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  space-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Gradio contract and deployed source
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://faycalhabibahmat-toumai-zenaba.hf.space/gradio_api/info" \
            --output gradio-info.json
          curl --fail --location --retry 3 --silent --show-error \
            "https://huggingface.co/spaces/faycalhabibahmat/toumai-zenaba/raw/main/app.py" \
            --output zenaba-space-app.py
      - name: Verify V3, French, fixed reference and fail-closed contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          info = json.loads(Path("gradio-info.json").read_text())
          assert "/synthesize" in info.get("named_endpoints", {})
          source = Path("zenaba-space-app.py").read_text()
          required = [
              'MODEL_VARIANT = "v3"',
              't3_model=MODEL_VARIANT',
              'LANGUAGE_ID = "fr"',
              'VOICE_NAME = "Zenaba"',
              'REFERENCE_AUDIO = Path("/tmp/fr_f1.flac")',
              'dbb98ac119e217b7c6c328b4ce3ba4fd691aa6c52f100cfa94b92972f1fa96a6',
              '_authorize_value(api_key)',
          ]
          for marker in required:
              assert marker in source, marker
          forbidden = ["edge_tts", "ElevenLabs", "Gemini", "Pocket TTS"]
          for marker in forbidden:
              assert marker not in source, marker
          print("ZENABA_CHATTERBOX_V3_CONTRACT_OK")
          PY
