name: Production chat public smoke

on:
  push:
    branches: [test/prod-chat-smoke-20260914]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public chat and API smoke
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local url="$1"
            local out="$2"
            local code
            code=$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -L -o "$out" -w '%{http_code}' "$url")
            echo "$url -> HTTP $code, $(wc -c < "$out") bytes"
            test "$code" = "200"
            test "$(wc -c < "$out")" -gt 500
          }

          check_page "https://toumaiai.com/chat/" /tmp/chat.html
          check_page "https://a4d11439.toumaiai-web.pages.dev/chat/" /tmp/pages-chat.html

          health_code=$(curl --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 45 -sS -o /tmp/health.json -w '%{http_code}' "https://api.toumaiai.com/health")
          echo "health -> HTTP $health_code"
          cat /tmp/health.json
          test "$health_code" = "200"
          python - <<'PY'
          import json
          with open('/tmp/health.json', encoding='utf-8') as f:
              data = json.load(f)
          assert data.get('status') == 'ok', data
          for key in ('database', 'cache', 'storage', 'search', 'whatsapp'):
              assert key in data, (key, data)
          print('health contract: OK')
          PY

          cors_code=$(curl --connect-timeout 15 --max-time 45 -sS -o /tmp/cors.body -D /tmp/cors.headers -w '%{http_code}' \
            -X OPTIONS "https://api.toumaiai.com/api/v1/chat/message" \
            -H 'Origin: https://toumaiai.com' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization')
          echo "CORS preflight -> HTTP $cors_code"
          tr -d '\r' < /tmp/cors.headers | tee /tmp/cors.normalized
          grep -i '^access-control-allow-origin: https://toumaiai.com$' /tmp/cors.normalized
          test "$cors_code" = "200"

          auth_code=$(curl --connect-timeout 15 --max-time 45 -sS -o /tmp/auth.json -w '%{http_code}' \
            -X POST "https://api.toumaiai.com/api/v1/chat/message" \
            -H 'Content-Type: application/json' \
            --data '{"message":"production smoke only"}')
          echo "unauthenticated chat guard -> HTTP $auth_code"
          cat /tmp/auth.json
          case "$auth_code" in
            401|403) ;;
            *) echo "Expected auth rejection, got $auth_code" >&2; exit 1;;
          esac

          echo "PRODUCTION_PUBLIC_SMOKE=PASS"
