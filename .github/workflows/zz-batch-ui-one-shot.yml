name: Grouped action UI one-shot

on:
  push:
    branches: [feat/chat-widget-runtime-20260914]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/chat-widget-runtime-20260914
          fetch-depth: 0
      - name: Apply source patch
        run: |
          python .github/scripts/apply_batch_ui.py
          git restore --source=HEAD -- .github
      - name: Type check
        run: |
          npm ci
          npx tsc --noEmit
      - name: Commit source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tool-ui.ts components/chat/widgets/ActionExecutionCard.tsx
          git diff --cached --check
          git commit -m "feat(chat): support grouped action confirmation cards"
          git push origin HEAD:feat/chat-widget-runtime-20260914
