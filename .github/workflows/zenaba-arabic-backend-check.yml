name: Zenaba Arabic Backend Check

on:
  push:
    branches:
      - feat/toumai-voice-v1-arabic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-arabic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal backend test dependencies
        run: |
          python -m pip install --disable-pip-version-check             edge-tts httpx gradio_client langdetect             pytest pytest-asyncio pydantic pydantic-settings

      - name: Compile Arabic Voice V1 surfaces
        working-directory: .ci/zenaba-arabic-backend
        run: |
          python -m py_compile             core/config.py             services/tts_service.py             services/chadian_tts_service.py             services/chadian_arabic_service.py             services/prononciation.py             routers/voice.py             scripts/smoke_zenaba_arabic.py             tests/test_toumai_voice_v1.py

      - name: Run Voice V1 tests
        working-directory: .ci/zenaba-arabic-backend
        env:
          TOUMAI_VOICE_V1_ENABLED: "true"
          TOUMAI_VOICE_ARABIC_ENABLED: "false"
        run: python -m pytest -q tests/test_toumai_voice_v1.py
