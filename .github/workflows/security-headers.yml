name: Static security headers

on:
  pull_request:
    paths:
      - 'public/_headers'
      - '.github/workflows/security-headers.yml'
  push:
    branches: [chore/security-csp-baseline]
    paths:
      - 'public/_headers'
      - '.github/workflows/security-headers.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required response protections
        shell: bash
        run: |
          set -euo pipefail
          grep -F "X-Content-Type-Options: nosniff" public/_headers
          grep -F "Referrer-Policy: strict-origin-when-cross-origin" public/_headers
          grep -F "X-Frame-Options: SAMEORIGIN" public/_headers
          grep -F "Content-Security-Policy: base-uri 'self'; object-src 'none'; frame-ancestors 'self'" public/_headers
          grep -F "Permissions-Policy:" public/_headers
