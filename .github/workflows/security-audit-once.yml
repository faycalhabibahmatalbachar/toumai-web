name: Security audit once

on:
  push:
    branches:
      - security/npm-audit-remediation-20260912
    paths:
      - .security-audit-trigger

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Audit exact dependency tree
        shell: bash
        run: |
          set +e
          npm audit --json > audit.json
          code=$?
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json','utf8'));
          console.log(JSON.stringify({
            metadata: report.metadata,
            vulnerabilities: report.vulnerabilities
          }, null, 2));
          NODE
          exit 0
