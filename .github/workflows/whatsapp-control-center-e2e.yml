name: WhatsApp Control Center E2E

on:
  pull_request:
    paths:
      - "app/whatsapp/**"
      - "components/whatsapp/**"
      - "lib/whatsapp-enterprise-api.ts"
      - "lib/connectors-api.ts"
      - "scripts/verify-whatsapp-control-center.mjs"
      - "scripts/verify-whatsapp-overview-sse-runtime.mjs"
      - ".github/workflows/whatsapp-control-center-e2e.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static export
        run: |
          python3 -m http.server 3101 -d out > /tmp/wa-control-center-server.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3101/whatsapp/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wa-control-center-server.log
          exit 1
      - name: Run control-center E2E
        run: node scripts/verify-whatsapp-control-center.mjs
      - name: Run Overview SSE runtime proof
        run: node scripts/verify-whatsapp-overview-sse-runtime.mjs
      - name: Upload control-center evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-control-center-e2e
          path: artifacts/whatsapp-control-center/
          if-no-files-found: warn
          retention-days: 14
