name: Dependency security

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-security.yml'
  schedule:
    - cron: '17 5 * * 1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Block high and critical dependency vulnerabilities
        id: audit
        continue-on-error: true
        run: npm audit --package-lock-only --audit-level=high 2>&1 | tee npm-audit.log
      - name: Upload dependency diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-diagnostics
          path: npm-audit.log
          retention-days: 3
      - name: Enforce dependency audit
        if: always()
        run: test "${{ steps.audit.outcome }}" = "success"
      - name: Typecheck
        if: success()
        run: npm run typecheck
      - name: Production build
        if: success()
        run: npm run build
      - name: Export-dependent regression tests
        if: success()
        run: npm test
