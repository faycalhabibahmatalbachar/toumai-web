name: WhatsApp chat integration

on:
  push:
    branches:
      - fix/whatsapp-chat-live-connector
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply deterministic WhatsApp integration
        run: node scripts/apply-whatsapp-chat-integration.mjs

      - name: Commit generated source integration if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already integrated"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/ChatMessage.tsx app/chat/page.tsx
            git commit -m "feat(chat): wire live WhatsApp connector into messages"
            git push origin HEAD:fix/whatsapp-chat-live-connector
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
