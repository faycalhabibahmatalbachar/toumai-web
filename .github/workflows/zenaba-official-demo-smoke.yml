name: Zenaba Official Demo Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zenaba-official-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Gradio client
        run: python -m pip install --disable-pip-version-check "gradio_client>=1.3,<2"
      - name: Generate real Zenaba reference audio
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from gradio_client import Client

          text = (
              "Bonjour Fayçal, comment puis-je vous aider aujourd’hui ? "
              "Je peux lire vos réponses, vos rappels et vos notifications "
              "avec une voix naturelle et agréable."
          )

          client = Client(
              "ResembleAI/Chatterbox-Multilingual-TTS",
              verbose=False,
          )
          result = client.predict(
              text,
              "fr",
              None,
              0.5,
              0.8,
              0,
              0.5,
              api_name="/generate_tts_audio",
          )

          path = result
          if isinstance(result, (tuple, list)) and result:
              path = result[0]
          if isinstance(path, dict):
              path = path.get("path") or path.get("name")

          if not isinstance(path, str):
              raise SystemExit(f"Unexpected Gradio result: {type(result)!r}")

          audio = Path(path)
          if not audio.exists():
              raise SystemExit(f"Generated audio not found: {audio}")

          size = audio.stat().st_size
          if size < 4096:
              raise SystemExit(f"Generated audio too small: {size} bytes")

          out = Path("zenaba-reference.wav")
          out.write_bytes(audio.read_bytes())

          magic = out.read_bytes()[:12]
          print(f"ZENABA_AUDIO_OK bytes={size} header={magic.hex()}")
          PY
      - name: Upload generated audio proof
        uses: actions/upload-artifact@v4
        with:
          name: zenaba-official-reference-audio
          path: zenaba-reference.wav
          if-no-files-found: error
          retention-days: 3
