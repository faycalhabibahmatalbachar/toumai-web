name: Zenaba Pocket Reference Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zenaba-official-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch selected official Kyutai reference
        run: |
          curl --fail --location --retry 3 --silent --show-error             "https://huggingface.co/kyutai/tts-voices/resolve/main/cml-tts/fr/1591_1028_000108-0004_enhanced.wav"             --output zenaba-reference.wav
      - name: Validate WAV reference
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("zenaba-reference.wav")
          data = p.read_bytes()
          if len(data) < 4096:
              raise SystemExit(f"Reference audio too small: {len(data)} bytes")
          if data[:4] != b"RIFF" or data[8:12] != b"WAVE":
              raise SystemExit(f"Invalid WAV header: {data[:12].hex()}")
          print(f"ZENABA_REFERENCE_OK bytes={len(data)} header={data[:12].hex()}")
          PY
      - name: Upload reference proof
        uses: actions/upload-artifact@v4
        with:
          name: zenaba-pocket-reference
          path: zenaba-reference.wav
          if-no-files-found: error
          retention-days: 3
