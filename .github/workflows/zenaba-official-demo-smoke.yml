name: Zenaba Chatterbox V3 Reference Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zenaba-official-demo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Resemble AI French reference
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/fr_f1.flac" \
            --output fr_f1.flac
      - name: Validate exact Zenaba reference
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          p = Path("fr_f1.flac")
          data = p.read_bytes()
          expected = "dbb98ac119e217b7c6c328b4ce3ba4fd691aa6c52f100cfa94b92972f1fa96a6"
          assert len(data) > 4096
          assert data[:4] == b"fLaC"
          assert hashlib.sha256(data).hexdigest() == expected
          print("ZENABA_FR_F1_OK")
          PY
