name: Deploy Toumaï Code Edge

on:
  push:
    branches: [codex/code-toumaiai-proxy]
    paths:
      - "infra/code-proxy-pages/**"
      - ".github/workflows/deploy-code-proxy.yml"
  workflow_dispatch:

concurrency:
  group: toumai-code-edge
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_PROJECT: toumai-code-edge
      CF_CODE_DOMAIN: code.toumaiai.com
      CF_PREVIEW_DOMAIN: preview.toumaiai.com
      CF_PAGES_HOST: toumai-code-edge.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les secrets Cloudflare
        shell: bash
        run: |
          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Secrets Cloudflare absents dans ce dépôt."
            exit 1
          fi

      - name: Créer ou retrouver le projet Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT"
          code=$(curl -sS -o /tmp/cf-project.json -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$api")

          if [ "$code" = "404" ]; then
            curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" \
              --data "{\"name\":\"$CF_PROJECT\",\"production_branch\":\"codex/code-toumaiai-proxy\"}" \
              | tee /tmp/cf-project-create.json
            jq -e '.success == true' /tmp/cf-project-create.json >/dev/null
          elif [ "$code" = "200" ]; then
            jq -e '.success == true' /tmp/cf-project.json >/dev/null
            echo "Projet Pages $CF_PROJECT déjà présent."
          else
            cat /tmp/cf-project.json
            echo "::error::Impossible de lire le projet Pages (HTTP $code)."
            exit 1
          fi

      - name: Déployer le proxy Pages vers Render
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy infra/code-proxy-pages/public --project-name toumai-code-edge --branch codex/code-toumaiai-proxy

      - name: Associer les domaines et configurer le DNS
        shell: bash
        run: |
          set -euo pipefail
          domains_api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains"
          curl -fsS \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$domains_api" > /tmp/cf-domains.json

          for domain in "$CF_CODE_DOMAIN" "$CF_PREVIEW_DOMAIN"; do
            echo "Configuration de $domain"
            if jq -e --arg domain "$domain" '.result | any(.name == $domain)' /tmp/cf-domains.json >/dev/null; then
              echo "$domain est déjà associé au projet."
            else
              curl -fsS \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST \
                "$domains_api" \
                --data "{\"name\":\"$domain\"}" > "/tmp/cf-domain-create-${domain//./-}.json"
              jq -e '.success == true' "/tmp/cf-domain-create-${domain//./-}.json" >/dev/null
            fi

            domain_api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains/$domain"
            curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$domain_api" > /tmp/cf-domain.json
            zone_id=$(jq -r '.result.zone_tag // empty' /tmp/cf-domain.json)
            if [ -z "$zone_id" ]; then
              cat /tmp/cf-domain.json
              echo "::error::Zone Cloudflare introuvable pour $domain."
              exit 1
            fi

            dns_api="https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records"
            curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$dns_api?type=CNAME&name=$domain" > /tmp/cf-dns.json
            jq -e '.success == true' /tmp/cf-dns.json >/dev/null
            record_id=$(jq -r '.result[0].id // empty' /tmp/cf-dns.json)
            payload="{\"type\":\"CNAME\",\"name\":\"$domain\",\"content\":\"$CF_PAGES_HOST\",\"ttl\":1,\"proxied\":true}"

            if [ -z "$record_id" ]; then
              curl -fsS \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -X POST \
                "$dns_api" \
                --data "$payload" > /tmp/cf-dns-write.json
            else
              curl -fsS \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -X PUT \
                "$dns_api/$record_id" \
                --data "$payload" > /tmp/cf-dns-write.json
            fi
            jq -e '.success == true' /tmp/cf-dns-write.json >/dev/null

            curl -fsS \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              "$domain_api" > /tmp/cf-domain-after-dns.json
            domain_status=$(jq -r '.result.status // "unknown"' /tmp/cf-domain-after-dns.json)
            validation_status=$(jq -r '.result.validation_data.status // "unknown"' /tmp/cf-domain-after-dns.json)
            if [ "$domain_status" != "active" ] && [ "$validation_status" != "active" ]; then
              curl -fsS \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                -X PATCH \
                "$domain_api" > /tmp/cf-domain-retry.json
              jq -e '.success == true' /tmp/cf-domain-retry.json >/dev/null
            else
              echo "$domain est déjà validé; pas de revalidation forcée."
            fi
          done

      - name: Attendre l'activation des domaines Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          for domain in "$CF_CODE_DOMAIN" "$CF_PREVIEW_DOMAIN"; do
            domain_api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT/domains/$domain"
            ready=0
            for attempt in $(seq 1 36); do
              curl -sS \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" \
                "$domain_api" > /tmp/cf-domain.json
              status=$(jq -r '.result.status // "unknown"' /tmp/cf-domain.json)
              validation=$(jq -r '.result.validation_data.status // "unknown"' /tmp/cf-domain.json)
              verification=$(jq -r '.result.verification_data.status // "unknown"' /tmp/cf-domain.json)
              echo "Domaine $domain: status=$status validation=$validation verification=$verification (tentative $attempt/36)"

              if [ "$status" = "active" ] || [ "$validation" = "active" ]; then
                ready=1
                break
              fi
              if [ "$status" = "blocked" ]; then
                cat /tmp/cf-domain.json
                exit 1
              fi
              sleep 10
            done
            if [ "$ready" != "1" ]; then
              cat /tmp/cf-domain.json
              echo "::error::$domain n'est pas devenu validé dans le délai prévu."
              exit 1
            fi
          done

      - name: Vérifier code.toumaiai.com
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 24); do
            status=$(curl -L -sS -o /tmp/toumai-code.html -w "%{http_code}" --connect-timeout 10 --max-time 30 https://code.toumaiai.com/)
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "code.toumaiai.com répond avec HTTP $status"
              exit 0
            fi
            echo "Tentative $attempt/24: HTTP $status"
            sleep 10
          done
          echo "::error::code.toumaiai.com ne répond pas correctement."
          exit 1

      - name: Vérifier l'API de découverte Preview
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --connect-timeout 10 --max-time 30 \
            https://code.toumaiai.com/toumai-preview/api/ports \
            -o /tmp/toumai-preview-ports.json
          cat /tmp/toumai-preview-ports.json
          jq -e '.success == true and (.ports | type == "array") and (.scannedAt | type == "string")' /tmp/toumai-preview-ports.json >/dev/null
          echo "API de découverte Preview opérationnelle."

      - name: Vérifier la passerelle preview.toumaiai.com
        shell: bash
        run: |
          set +e
          for attempt in $(seq 1 24); do
            status=$(curl -sS -o /tmp/toumai-preview.txt -w "%{http_code}" --connect-timeout 10 --max-time 30 https://preview.toumaiai.com/)
            if [ "$status" = "400" ]; then
              grep -q "Aucune prévisualisation active" /tmp/toumai-preview.txt && {
                echo "preview.toumaiai.com est actif et attend un port Toumaï Code."
                exit 0
              }
            fi
            echo "Tentative $attempt/24: HTTP $status"
            sleep 10
          done
          cat /tmp/toumai-preview.txt
          echo "::error::preview.toumaiai.com ne répond pas avec la passerelle attendue."
          exit 1
