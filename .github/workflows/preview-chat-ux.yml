name: Preview Chat UX

on:
  push:
    branches:
      - ux/chat-redesign-sprint-1
  workflow_dispatch:

concurrency:
  group: preview-chat-ux
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l'application
        run: npm run build

      - name: Vérifier les secrets Cloudflare
        id: cloudflare
        shell: bash
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Secrets Cloudflare absents : preview impossible."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Déployer la preview Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name toumaiai-web --branch ux-chat-redesign-sprint-1
