name: Chat rich response CI

on:
  pull_request:
    paths:
      - "app/chat/**"
      - "components/ChatMessage.tsx"
      - "components/chat/**"
      - "lib/chat-*.ts"
      - "lib/documents-api.ts"
      - "lib/prechargement-conversations.ts"
      - ".github/workflows/chat-rich-response-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact lockfile
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Regression tests
        run: npm test
