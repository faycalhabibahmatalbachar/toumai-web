name: WhatsApp Control Center Backend Production

on:
  pull_request:
    paths:
      - "app/whatsapp/**"
      - "components/whatsapp/**"
      - "lib/whatsapp-enterprise-api.ts"
      - ".github/workflows/whatsapp-control-center-backend-production.yml"
  workflow_dispatch:

jobs:
  backend-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      REQUIRED_BACKEND_MERGE_SHA: 2c8a0e8206a2c505cc24405281285c8c4e18a1d0
      BUILD_URL: https://api.toumaiai.com/api/v1/app/build
      API_BASE: https://api.toumaiai.com/api/v1
    steps:
      - name: Wait for an attested backend production build
        shell: bash
        run: |
          set -euo pipefail
          : > backend-production-build.log
          rm -f backend-production-build.json

          for attempt in $(seq 1 36); do
            response="$(curl -fsS --connect-timeout 10 --max-time 20 "$BUILD_URL" || true)"
            if [ -n "$response" ]; then
              printf '%s' "$response" > backend-production-build.json.tmp
              if RESPONSE="$response" python - <<'PY'
          import json
          import os

          try:
              payload = json.loads(os.environ["RESPONSE"])
          except Exception:
              raise SystemExit(2)
          data = payload.get("data") if isinstance(payload, dict) else {}
          observed = str((data or {}).get("commit_sha") or "").strip()
          attested = (data or {}).get("attested") is True
          raise SystemExit(0 if attested and observed else 1)
          PY
              then
                mv backend-production-build.json.tmp backend-production-build.json
                observed="$(python - <<'PY'
          import json
          p=json.load(open("backend-production-build.json", encoding="utf-8"))
          print((p.get("data") or {}).get("commit_sha") or "")
          PY
                )"
                echo "Attested backend production build observed: $observed"
                echo "Required feature merge ancestor: $REQUIRED_BACKEND_MERGE_SHA"
                exit 0
              fi
            fi
            echo "Backend attestation not ready ($attempt/36)." | tee -a backend-production-build.log
            sleep 10
          done
          echo "::error::No attested backend production build became available."
          exit 1

      - name: Wait for protected control-center routes
        shell: bash
        run: |
          set -euo pipefail

          route_status() {
            method="$1"
            url="$2"
            if [ "$method" = "POST" ]; then
              curl -sS -o /tmp/wa-probe.json -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                -X POST -H 'Content-Type: application/json' -d '{"to":"23566000000","message":"probe"}' "$url" || true
            else
              curl -sS -o /tmp/wa-probe.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true
            fi
          }

          protected_ok() {
            case "$1" in
              401|403|428) return 0 ;;
              *) return 1 ;;
            esac
          }

          for attempt in $(seq 1 72); do
            conversations="$(route_status GET "$API_BASE/whatsapp/conversations?limit=1")"
            history="$(route_status GET "$API_BASE/whatsapp/conversation/messages?chat_id=probe")"
            status="$(route_status GET "$API_BASE/whatsapp/message/status?msg_id=probe")"
            send="$(route_status POST "$API_BASE/whatsapp/message/send")"

            build="$(curl -fsS --connect-timeout 10 --max-time 20 "$BUILD_URL" || true)"
            observed="$(BUILD="$build" python - <<'PY'
          import json, os
          try:
              payload=json.loads(os.environ.get("BUILD") or "{}")
              print((payload.get("data") or {}).get("commit_sha") or "")
          except Exception:
              print("")
          PY
            )"

            echo "attempt=$attempt observed_sha=${observed:-unknown} conversations=$conversations history=$history status=$status send=$send"

            if protected_ok "$conversations" && protected_ok "$history" && protected_ok "$status" && protected_ok "$send"; then
              echo "All WhatsApp Control Center backend routes are deployed and protected."
              exit 0
            fi

            sleep 10
          done

          echo "::error::WhatsApp Control Center routes were not deployed within the bounded window."
          exit 1

      - name: Upload backend production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-control-center-backend-production
          path: |
            backend-production-build.json
            backend-production-build.json.tmp
            backend-production-build.log
          if-no-files-found: warn
          retention-days: 14
