name: Deploy to Cloudflare Pages

# Le site vit sur Cloudflare Pages (projet « toumaiai ») depuis que
# toumaiai.com, www et chat pointent dessus. L'ancien déploiement GitHub Pages
# a été retiré : il continuait de publier sur une cible que plus aucun nom de
# domaine ne sert, ce qui donnait l'illusion d'un déploiement réussi pendant
# que le site réel se figeait.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

      # Sans jeton, on s'arrête ici en le disant clairement plutôt que
      # d'échouer sur une erreur d'authentification illisible.
      - name: Vérifier le jeton de déploiement
        id: jeton
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN absent — le site n'a PAS été déployé. Ajoutez le secret, ou connectez le dépôt au projet Pages « toumaiai » depuis Cloudflare."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer sur Cloudflare Pages
        if: steps.jeton.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name toumaiai --branch main
