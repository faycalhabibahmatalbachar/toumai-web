name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp exact Web build SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          printf '{"commit_sha":"%s","repository":"%s"}\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > public/deployment.json
      - run: npm run build
      - name: Vérifier que le correctif du sélecteur est dans le build
        run: grep -R -F "Choisir un modèle" out/_next/static >/dev/null
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets Cloudflare absents — aucun déploiement de production possible."
            exit 1
          fi
      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name toumaiai-web --branch main
      - name: Smoke backend WhatsApp compatibility (non-blocking)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            method="$1"
            url="$2"
            if [ "$method" = "POST" ]; then
              curl -sS -o /tmp/wa-compat.json -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                -X POST -H 'Content-Type: application/json' \
                -d '{"chat_id":"23566000000","text":"probe"}' "$url" || true
            else
              curl -sS -o /tmp/wa-compat.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true
            fi
          }
          conversations_status="$(probe GET 'https://api.toumaiai.com/api/v1/whatsapp/autopilot/conversations?limit=1')"
          send_status="$(probe POST 'https://api.toumaiai.com/api/v1/whatsapp/suggestion/send')"
          case "$conversations_status" in 401|403|428) ;; *) echo "::error::Legacy conversations route unavailable: HTTP $conversations_status"; exit 1 ;; esac
          case "$send_status" in 401|403|428) ;; *) echo "::error::Legacy send route unavailable: HTTP $send_status"; exit 1 ;; esac
          echo "Compatibility backend routes are present and authentication-protected."

      - name: Attest exact Web SHA on toumaiai.com
        shell: bash
        run: |
          set -euo pipefail
          expected="$GITHUB_SHA"
          for attempt in $(seq 1 24); do
            stamp="${expected}-${attempt}-$(date +%s)"
            body="$(curl -fsSL --connect-timeout 10 --max-time 20 \
              -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              "https://toumaiai.com/deployment.json?deploy=${stamp}" || true)"
            observed="$(printf '%s' "$body" | sed -n 's/.*"commit_sha":"\([^"]*\)".*/\1/p')"
            if [ "$observed" = "$expected" ]; then
              echo "Cloudflare custom domain attested exact SHA: $observed"
              exit 0
            fi
            echo "Custom domain not on exact SHA yet (attempt ${attempt}/24, observed=${observed:-none})."
            sleep 5
          done
          echo "::error::Cloudflare Pages uploaded successfully but toumaiai.com did not attest exact SHA $expected within 120 seconds."
          exit 1
