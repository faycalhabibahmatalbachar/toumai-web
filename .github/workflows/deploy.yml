name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vérifier que le correctif du sélecteur est dans le build
        run: grep -R -F "Choisir un modèle" out/_next/static >/dev/null
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets Cloudflare absents — aucun déploiement de production possible."
            exit 1
          fi
      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name toumaiai-web --branch main
      - name: Vérifier WhatsApp Enterprise sur le domaine public
        shell: bash
        run: |
          set -euo pipefail
          whatsapp_marker="Un espace calme pour piloter WhatsApp avec Toumaï AI."
          ai_marker="Contrôlez la manière dont l’IA répond."
          for attempt in 1 2 3 4 5 6; do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            whatsapp_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/?deploy=${stamp}" || true)"
            ai_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/ai/?deploy=${stamp}" || true)"
            if grep -Fq "$whatsapp_marker" <<<"$whatsapp_html" && grep -Fq "$ai_marker" <<<"$ai_html"; then
              echo "Production verified on toumaiai.com for ${GITHUB_SHA}"
              exit 0
            fi
            echo "Public domain has not switched yet (attempt ${attempt}/6)."
            sleep 5
          done
          echo "::error::Cloudflare deployment succeeded but toumaiai.com does not serve the new WhatsApp Enterprise pages."
          exit 1
