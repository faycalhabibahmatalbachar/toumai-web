name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Vérifier que le correctif du sélecteur est dans le build
        run: grep -R -F "Choisir un modèle" out/_next/static >/dev/null
      - name: Vérifier les secrets Cloudflare
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::error::Secrets Cloudflare absents — aucun déploiement de production possible."
            exit 1
          fi
      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name toumaiai-web --branch main
      - name: Vérifier les routes backend de compatibilité WhatsApp
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            method="$1"
            url="$2"
            if [ "$method" = "POST" ]; then
              curl -sS -o /tmp/wa-compat.json -w '%{http_code}' --connect-timeout 10 --max-time 20 \
                -X POST -H 'Content-Type: application/json' \
                -d '{"chat_id":"23566000000","text":"probe"}' "$url" || true
            else
              curl -sS -o /tmp/wa-compat.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "$url" || true
            fi
          }
          conversations_status="$(probe GET 'https://api.toumaiai.com/api/v1/whatsapp/autopilot/conversations?limit=1')"
          send_status="$(probe POST 'https://api.toumaiai.com/api/v1/whatsapp/suggestion/send')"
          case "$conversations_status" in 401|403|428) ;; *) echo "::error::Legacy conversations route unavailable: HTTP $conversations_status"; exit 1 ;; esac
          case "$send_status" in 401|403|428) ;; *) echo "::error::Legacy send route unavailable: HTTP $send_status"; exit 1 ;; esac
          echo "Compatibility backend routes are present and authentication-protected."

      - name: Vérifier WhatsApp Enterprise sur le domaine public
        shell: bash
        run: |
          set -euo pipefail
          whatsapp_marker="WhatsApp Overview"
          conversations_marker="Conversations WhatsApp"
          automations_marker="Automatisations WhatsApp"
          ai_marker="Contrôlez la manière dont l’IA répond."
          for attempt in 1 2 3 4 5 6; do
            stamp="${GITHUB_SHA}-${attempt}-$(date +%s)"
            whatsapp_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/?deploy=${stamp}" || true)"
            conversations_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/conversations/?deploy=${stamp}" || true)"
            automations_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/automations/?deploy=${stamp}" || true)"
            ai_html="$(curl -fsSL --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "https://toumaiai.com/whatsapp/ai/?deploy=${stamp}" || true)"
            if grep -Fq "$whatsapp_marker" <<<"$whatsapp_html" \
              && grep -Fq "$conversations_marker" <<<"$conversations_html" \
              && grep -Fq "$automations_marker" <<<"$automations_html" \
              && grep -Fq "$ai_marker" <<<"$ai_html"; then
              echo "Production verified on toumaiai.com for ${GITHUB_SHA}"
              exit 0
            fi
            echo "Public domain has not switched yet (attempt ${attempt}/6)."
            sleep 5
          done
          echo "::error::Cloudflare deployment succeeded but toumaiai.com does not serve the new WhatsApp Enterprise pages."
          exit 1
