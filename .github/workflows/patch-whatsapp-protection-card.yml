name: Patch WhatsApp protection card
on:
  push:
    branches: [feat/whatsapp-protection-card]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch API contract and card
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('lib/connectors-api.ts')
          s=p.read_text(encoding='utf-8')
          anchor='''  /** Ce qu'aucune version ne fera, avec la raison. */\n  hors_de_portee?: Record<string, string>;\n}\n'''
          replacement='''  /** Ce qu'aucune version ne fera, avec la raison. */\n  hors_de_portee?: Record<string, string>;\n  /** État réel du régulateur serveur. Absent avec un backend plus ancien. */\n  protection?: WaProtectionState;\n}\n\nexport interface WaProtectionClassState {\n  derniere_minute: number;\n  derniere_heure: number;\n  dernier_jour: number;\n  plafond_jour: number;\n  echecs_consecutifs: number;\n  en_repos: boolean;\n}\n\nexport interface WaProtectionState {\n  available: boolean;\n  shared: boolean | null;\n  source: "redis" | "local" | "unavailable";\n  mode: "normal" | "prudence" | "unknown";\n  prudence: { active: boolean; reste_s: number };\n  classes: Partial<Record<"lecture" | "ecriture" | "sensible", WaProtectionClassState>>;\n  policies: {\n    anti_duplicate: boolean;\n    burst_control: boolean;\n    verified_execution: boolean;\n  };\n}\n'''
          if anchor not in s:
              raise SystemExit('WaEtat contract anchor missing')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')

          p=Path('components/chat/WhatsAppConnectorCard.tsx')
          s=p.read_text(encoding='utf-8')
          import_anchor='''} from "@/lib/connectors-api";\n'''
          if import_anchor not in s:
              raise SystemExit('card import anchor missing')
          s=s.replace(import_anchor, import_anchor + 'import { WhatsAppProtectionPanel } from "./WhatsAppProtectionPanel";\n', 1)
          render_anchor='''        <div className="mt-4 flex flex-wrap items-center gap-2 border-t border-[var(--border)] pt-4">\n'''
          if render_anchor not in s:
              raise SystemExit('card actions anchor missing')
          s=s.replace(render_anchor, '''        <WhatsAppProtectionPanel protection={etat?.protection} connected={connected} />\n\n''' + render_anchor, 1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/verify-whatsapp-routing.mjs')
          s=p.read_text(encoding='utf-8')
          anchor="""if (!card.includes('Contacts synchronisés')) {\n  throw new Error('contact count must be labelled as synchronized contacts');\n}\n"""
          replacement=anchor+"""if (!card.includes('WhatsAppProtectionPanel')) {\n  throw new Error('connector card must render the real server protection panel');\n}\nconst api = fs.readFileSync('lib/connectors-api.ts', 'utf8');\nif (!api.includes('protection?: WaProtectionState;')) {\n  throw new Error('WaEtat must expose the optional server protection contract');\n}\n"""
          if anchor not in s:
              raise SystemExit('routing regression anchor missing')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify patches
        run: |
          node scripts/verify-whatsapp-routing.mjs
          git diff --check
      - name: Commit and remove bootstrap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/connectors-api.ts components/chat/WhatsAppConnectorCard.tsx scripts/verify-whatsapp-routing.mjs
          git rm .github/workflows/patch-whatsapp-protection-card.yml
          git commit -m 'feat(whatsapp): render real server protection state'
          git push origin HEAD:feat/whatsapp-protection-card
