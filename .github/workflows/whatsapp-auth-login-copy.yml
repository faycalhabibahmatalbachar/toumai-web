name: WhatsApp auth copy privacy

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/login/page.tsx'
      - 'scripts/verify-whatsapp-auth-login-copy.mjs'
      - '.github/workflows/whatsapp-auth-login-copy.yml'

permissions:
  contents: read

jobs:
  privacy-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-whatsapp-auth-login-copy.mjs
