name: Test UnoRouter

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/test-unorouter.yml

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      UNOROUTER_BASE_URL: https://api.unorouter.com/v1
    steps:
      - name: Vérifier la présence du secret
        shell: bash
        run: |
          if [ -z "$UNOROUTER_API_KEY" ]; then
            echo "Le secret GitHub UNOROUTER_API_KEY est absent."
            exit 1
          fi
          case "$UNOROUTER_API_KEY" in
            Bearer\ *)
              echo "Format invalide : enregistrez uniquement la clé, sans le préfixe Bearer."
              exit 1
              ;;
          esac
          if printf '%s' "$UNOROUTER_API_KEY" | grep -q '[[:space:]]'; then
            echo "Format invalide : le secret contient un espace ou un retour à la ligne."
            exit 1
          fi
          echo "Format UnoRouter valide."

      - name: Vérifier le catalogue de modèles
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 30 \
            --header "Authorization: Bearer $UNOROUTER_API_KEY" \
            "$UNOROUTER_BASE_URL/models")"
          if [ "$status" != "200" ]; then
            echo "UnoRouter /models a répondu HTTP $status."
            exit 1
          fi
          model_count="$(jq '.data | length' "$response_file")"
          if [ "$model_count" -lt 1 ]; then
            echo "Le catalogue UnoRouter est vide ou invalide."
            exit 1
          fi
          echo "Catalogue UnoRouter accessible : $model_count modèles retournés."

      - name: Tester le routage gratuit avec repli
        shell: bash
        run: |
          models_file="$(mktemp)"
          curl --silent --show-error --fail \
            --max-time 30 \
            --header "Authorization: Bearer $UNOROUTER_API_KEY" \
            "$UNOROUTER_BASE_URL/models" > "$models_file"

          mapfile -t free_models < <(
            jq -r '.data[]?.id | select(test("(:free|/free)$"; "i"))' "$models_file" | head -n 5
          )
          if [ "${#free_models[@]}" -eq 0 ]; then
            echo "Aucun alias gratuit détecté dans le catalogue UnoRouter."
            exit 1
          fi

          request_file="$(mktemp)"
          response_file="$(mktemp)"
          success=0
          last_status="aucun"
          last_code="inconnu"

          for model in "${free_models[@]}"; do
            jq -n --arg model "$model" '{
              model: $model,
              messages: [{role: "user", content: "Réponds uniquement par OK."}],
              max_tokens: 8,
              stream: false
            }' > "$request_file"

            last_status="$(curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --max-time 60 \
              --header "Authorization: Bearer $UNOROUTER_API_KEY" \
              --header 'Content-Type: application/json' \
              --data-binary "@$request_file" \
              "$UNOROUTER_BASE_URL/chat/completions")"

            if [ "$last_status" = "200" ] && jq -e '.choices[0].message.content | strings | length > 0' "$response_file" >/dev/null; then
              echo "Réponse UnoRouter gratuite reçue et valide."
              success=1
              break
            fi

            last_code="$(jq -r '.error.code // .error.type // "inconnu"' "$response_file" 2>/dev/null || true)"
            echo "Un modèle gratuit a répondu HTTP $last_status (code : $last_code), essai du repli suivant."
            sleep 2
          done

          if [ "$success" -ne 1 ]; then
            echo "Tous les replis gratuits testés ont échoué. Dernier statut HTTP $last_status (code : $last_code)."
            exit 1
          fi
