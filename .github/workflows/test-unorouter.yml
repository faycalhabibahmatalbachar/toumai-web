name: Test UnoRouter

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      UNOROUTER_API_KEY: ${{ secrets.UNOROUTER_API_KEY }}
      UNOROUTER_BASE_URL: https://api.unorouter.com/v1
    steps:
      - name: Vérifier la présence du secret
        shell: bash
        run: |
          if [ -z "$UNOROUTER_API_KEY" ]; then
            echo "Le secret GitHub UNOROUTER_API_KEY est absent."
            exit 1
          fi

      - name: Vérifier le catalogue de modèles
        shell: bash
        run: |
          response_file="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 30 \
            --header "Authorization: Bearer $UNOROUTER_API_KEY" \
            "$UNOROUTER_BASE_URL/models")"
          if [ "$status" != "200" ]; then
            echo "UnoRouter /models a répondu HTTP $status."
            exit 1
          fi
          model_count="$(jq '.data | length' "$response_file")"
          if [ "$model_count" -lt 1 ]; then
            echo "Le catalogue UnoRouter est vide ou invalide."
            exit 1
          fi
          echo "Catalogue UnoRouter accessible : $model_count modèles retournés."

      - name: Tester une réponse gratuite minimale
        shell: bash
        run: |
          request_file="$(mktemp)"
          response_file="$(mktemp)"
          jq -n '{
            model: "gpt-oss-120b:free",
            messages: [{role: "user", content: "Réponds uniquement par OK."}],
            max_tokens: 8,
            stream: false
          }' > "$request_file"
          status="$(curl --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --max-time 60 \
            --header "Authorization: Bearer $UNOROUTER_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary "@$request_file" \
            "$UNOROUTER_BASE_URL/chat/completions")"
          if [ "$status" != "200" ]; then
            error_code="$(jq -r '.error.code // "inconnu"' "$response_file" 2>/dev/null || true)"
            echo "UnoRouter chat a répondu HTTP $status (code : $error_code)."
            exit 1
          fi
          jq -e '.choices[0].message.content | strings | length > 0' "$response_file" >/dev/null
          echo "Réponse UnoRouter reçue et valide."
