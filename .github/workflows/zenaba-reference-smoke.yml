# La référence vocale que Zenaba utilise RÉELLEMENT aujourd'hui.
#
# POURQUOI CE FICHIER EXISTE À CÔTÉ DE L'AUTRE
# ---------------------------------------------
# `zenaba-official-demo-smoke.yml` atteste l'échantillon Kyutai du moteur
# Pocket, conservé comme option future. Le moteur ACTIF est Chatterbox
# Multilingual V3, et son timbre vient de `fr_f1.flac`. Attester un fichier
# que la voix en service n'utilise pas donnerait une certification verte sur
# le mauvais artefact : exactement le genre de preuve qui rassure sans rien
# prouver.
#
# L'empreinte ci-dessous a été relevée le 20/09/2026 sur le fichier servi.
# Si elle change, ce n'est pas au test de s'adapter : c'est que le timbre de
# Zenaba a changé sans que personne ne l'ait décidé.
name: Zenaba Chatterbox Reference

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/zenaba-reference-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the reference Chatterbox actually speaks with
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://storage.googleapis.com/chatterbox-demo-samples/mtl_prompts/fr_f1.flac" \
            --output zenaba-fr-f1.flac
      - name: Validate FLAC reference
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          data = Path("zenaba-fr-f1.flac").read_bytes()
          if data[:4] != b"fLaC":
              raise SystemExit(f"Not a FLAC stream: {data[:4].hex()}")
          if len(data) != 263880:
              raise SystemExit(f"Unexpected size: {len(data)} bytes")
          digest = hashlib.sha256(data).hexdigest()
          expected = "dbb98ac119e217b7c6c328b4ce3ba4fd691aa6c52f100cfa94b92972f1fa96a6"
          if digest != expected:
              raise SystemExit(f"Unexpected Zenaba reference SHA-256: {digest}")
          print(f"ZENABA_CHATTERBOX_REFERENCE_OK bytes={len(data)} sha256={digest}")
          PY
      - name: Upload reference proof
        uses: actions/upload-artifact@v4
        with:
          name: zenaba-chatterbox-reference
          path: zenaba-fr-f1.flac
          if-no-files-found: error
          retention-days: 3
