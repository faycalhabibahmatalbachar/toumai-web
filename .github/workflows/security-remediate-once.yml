name: Security remediate once

on:
  push:
    branches:
      - security/npm-audit-remediation-20260912
    paths:
      - .security-remediate-trigger

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/npm-audit-remediation-20260912
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Upgrade patched Next.js line
        run: npm install --save-exact next@16.3.5 eslint-config-next@16.3.5
      - name: Apply compatible transitive security fixes
        run: npm audit fix
      - name: Validate application
        run: |
          npm run typecheck
          npm run lint
          npm run build
      - name: Verify remaining vulnerabilities
        run: npm audit --audit-level=high
      - name: Commit dependency remediation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'fix(security): patch Next.js and vulnerable dependencies'
          git push origin HEAD:security/npm-audit-remediation-20260912
