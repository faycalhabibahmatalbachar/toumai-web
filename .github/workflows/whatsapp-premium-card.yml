name: WhatsApp premium connector card

on:
  push:
    branches:
      - feat/whatsapp-premium-card
  pull_request:
    branches:
      - main
    paths:
      - "components/chat/WhatsAppConnectorCard.tsx"
      - ".github/workflows/whatsapp-premium-card.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Card invariants
        shell: bash
        run: |
          grep -q "Anti-rafale active" components/chat/WhatsAppConnectorCard.tsx
          grep -q "0 synchronisé ≠ aucun contact WhatsApp" components/chat/WhatsAppConnectorCard.tsx
          grep -q "Aucun état n’est inventé" components/chat/WhatsAppConnectorCard.tsx
