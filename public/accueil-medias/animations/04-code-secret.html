<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toumaï — Code secret autocorrectif</title>
  <style>
    :root {
      --terracotta: #d97857;
      --terracotta-deep: #bd5c3f;
      --ink: #171310;
      --cream: #f6eee5;
      --cream-soft: #ead6c8;
      --orange: #f29a69;
      --gold: #f2c36f;
      --sage: #89a48e;
      --shadow: rgba(50, 20, 12, .22);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--terracotta);
    }

    body {
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .stage {
      width: min(100vw, 1200px);
      aspect-ratio: 5 / 3;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(255, 238, 221, .12), transparent 38%),
        var(--terracotta);
      cursor: pointer;
      user-select: none;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .well {
      fill: #2a1d18;
      stroke: rgba(246, 238, 229, .15);
      stroke-width: 2;
    }

    .source-pad {
      fill: rgba(118, 52, 35, .28);
      stroke: rgba(246, 238, 229, .38);
      stroke-width: 1.5;
    }

    .hand-image {
      pointer-events: none;
      filter: drop-shadow(0 7px 5px rgba(50, 20, 12, .08));
    }

    #right-hand,
    #left-hand,
    #carried-peg,
    #carried-code {
      will-change: transform;
    }

    #scan-line {
      filter: drop-shadow(0 0 7px rgba(246, 238, 229, .8));
    }

    #victory-halo {
      transform-origin: 600px 532px;
      filter: drop-shadow(0 0 13px rgba(242, 195, 111, .75));
    }

    .source-core {
      filter: drop-shadow(0 4px 3px rgba(50, 20, 12, .16));
      transform-box: fill-box;
      transform-origin: center;
    }

    #secret-code,
    #code-strip-source,
    [id^="feedback-"] {
      transform-box: fill-box;
      transform-origin: center;
    }

    @media (max-aspect-ratio: 5 / 3) {
      .stage {
        width: 100vw;
        height: auto;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .stage { cursor: default; }
    }
  </style>
</head>
<body>
  <main class="stage" id="stage" aria-label="Animation d'un jeu de code secret résolu progressivement par Toumaï">
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="scene-title scene-desc">
      <title id="scene-title">Toumaï résout un code secret en trois tentatives</title>
      <desc id="scene-desc">Une main gauche place un code caché. Une main droite teste trois combinaisons, utilise les indices et trouve le code exact.</desc>

      <defs>
        <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#4f2418" flood-opacity=".22" />
        </filter>
        <filter id="peg-shadow" x="-50%" y="-50%" width="200%" height="200%">
          <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3b1b12" flood-opacity=".22" />
        </filter>
        <clipPath id="board-clip">
          <rect x="324" y="72" width="552" height="580" rx="54" />
        </clipPath>
      </defs>

      <!-- Plateau central, volontairement sans texte. -->
      <rect x="324" y="72" width="552" height="580" rx="54" fill="var(--cream)" filter="url(#soft-shadow)" />
      <rect x="346" y="94" width="508" height="536" rx="38" fill="var(--ink)" />

      <!-- Zone du code secret. -->
      <rect x="390" y="108" width="420" height="112" rx="31" fill="#241916" stroke="rgba(246,238,229,.18)" stroke-width="2" />
      <g id="secret-slots">
        <circle class="well" cx="465" cy="164" r="25" />
        <circle class="well" cx="555" cy="164" r="25" />
        <circle class="well" cx="645" cy="164" r="25" />
        <circle class="well" cx="735" cy="164" r="25" />
      </g>
      <g id="secret-code" opacity="0">
        <circle cx="465" cy="164" r="21" fill="var(--orange)" filter="url(#peg-shadow)" />
        <circle cx="555" cy="164" r="21" fill="var(--cream)" filter="url(#peg-shadow)" />
        <circle cx="645" cy="164" r="21" fill="var(--sage)" filter="url(#peg-shadow)" />
        <circle cx="735" cy="164" r="21" fill="var(--gold)" filter="url(#peg-shadow)" />
      </g>

      <!-- Le cache devient opaque après la pose du code. -->
      <g id="secret-cover" transform="translate(0 -134)">
        <rect x="378" y="96" width="444" height="136" rx="35" fill="#201714" stroke="var(--cream)" stroke-width="7" />
        <path d="M462 151 H738" fill="none" stroke="#4a332b" stroke-width="8" stroke-linecap="round" />
        <circle cx="600" cy="151" r="14" fill="var(--terracotta)" />
      </g>

      <!-- Trois lignes de tentative. -->
      <g id="guess-grid">
        <g data-row="0">
          <rect x="384" y="252" width="432" height="82" rx="25" fill="#211714" />
          <circle class="well" cx="445" cy="293" r="23" />
          <circle class="well" cx="525" cy="293" r="23" />
          <circle class="well" cx="605" cy="293" r="23" />
          <circle class="well" cx="685" cy="293" r="23" />
          <g id="feedback-0" opacity="0">
            <circle cx="752" cy="281" r="7" fill="var(--gold)" />
            <circle cx="776" cy="281" r="7" fill="none" stroke="var(--cream)" stroke-width="3" />
            <circle cx="752" cy="305" r="7" fill="none" stroke="var(--cream)" stroke-width="3" />
            <circle cx="776" cy="305" r="7" fill="none" stroke="var(--cream)" stroke-width="3" />
          </g>
        </g>
        <g data-row="1">
          <rect x="384" y="369" width="432" height="82" rx="25" fill="#211714" />
          <circle class="well" cx="445" cy="410" r="23" />
          <circle class="well" cx="525" cy="410" r="23" />
          <circle class="well" cx="605" cy="410" r="23" />
          <circle class="well" cx="685" cy="410" r="23" />
          <g id="feedback-1" opacity="0">
            <circle cx="752" cy="398" r="7" fill="var(--gold)" />
            <circle cx="776" cy="398" r="7" fill="var(--gold)" />
            <circle cx="752" cy="422" r="7" fill="none" stroke="var(--cream)" stroke-width="3" />
            <circle cx="776" cy="422" r="7" fill="none" stroke="var(--cream)" stroke-width="3" />
          </g>
        </g>
        <g data-row="2">
          <rect x="384" y="486" width="432" height="82" rx="25" fill="#211714" />
          <circle class="well" cx="445" cy="527" r="23" />
          <circle class="well" cx="525" cy="527" r="23" />
          <circle class="well" cx="605" cy="527" r="23" />
          <circle class="well" cx="685" cy="527" r="23" />
          <g id="feedback-2" opacity="0">
            <circle cx="752" cy="515" r="7" fill="var(--gold)" />
            <circle cx="776" cy="515" r="7" fill="var(--gold)" />
            <circle cx="752" cy="539" r="7" fill="var(--gold)" />
            <circle cx="776" cy="539" r="7" fill="var(--gold)" />
          </g>
        </g>
      </g>

      <path id="scan-line" d="M408 238 H792" fill="none" stroke="var(--cream)" stroke-width="3" stroke-linecap="round" opacity="0" />
      <rect id="victory-halo" x="376" y="478" width="448" height="98" rx="30" fill="none" stroke="var(--gold)" stroke-width="6" opacity="0" />

      <!-- Réserve du créateur du code, à gauche. -->
      <g id="maker-tray">
        <rect x="71" y="102" width="184" height="124" rx="35" class="source-pad" />
        <g id="code-strip-source">
          <rect x="91" y="130" width="144" height="68" rx="22" fill="rgba(42,29,24,.38)" />
          <circle cx="115" cy="164" r="15" fill="var(--orange)" />
          <circle cx="147" cy="164" r="15" fill="var(--cream)" />
          <circle cx="179" cy="164" r="15" fill="var(--sage)" />
          <circle cx="211" cy="164" r="15" fill="var(--gold)" />
        </g>
      </g>

      <!-- Réserve de pions de la main qui raisonne, à droite. -->
      <g id="solver-tray">
        <g class="source" data-color="orange" transform="translate(970 184)">
          <rect x="-42" y="-42" width="84" height="84" rx="25" class="source-pad" />
          <circle class="source-core" r="24" fill="var(--orange)" />
          <circle r="7" fill="rgba(255,255,255,.28)" />
        </g>
        <g class="source" data-color="cream" transform="translate(1080 184)">
          <rect x="-42" y="-42" width="84" height="84" rx="25" class="source-pad" />
          <circle class="source-core" r="24" fill="var(--cream)" />
          <circle r="7" fill="rgba(217,120,87,.42)" />
        </g>
        <g class="source" data-color="sage" transform="translate(970 316)">
          <rect x="-42" y="-42" width="84" height="84" rx="25" class="source-pad" />
          <circle class="source-core" r="24" fill="var(--sage)" />
          <circle r="7" fill="rgba(255,255,255,.25)" />
        </g>
        <g class="source" data-color="gold" transform="translate(1080 316)">
          <rect x="-42" y="-42" width="84" height="84" rx="25" class="source-pad" />
          <circle class="source-core" r="24" fill="var(--gold)" />
          <circle r="7" fill="rgba(255,255,255,.28)" />
        </g>
      </g>

      <!-- Pions réellement posés, générés par le script. -->
      <g id="placed-pegs"></g>

      <!-- Objets transportés, placés sous le contour des mains. -->
      <g id="carried-code" opacity="0">
        <rect x="-72" y="-34" width="144" height="68" rx="22" fill="#2a1d18" />
        <circle cx="-48" r="15" fill="var(--orange)" />
        <circle cx="-16" r="15" fill="var(--cream)" />
        <circle cx="16" r="15" fill="var(--sage)" />
        <circle cx="48" r="15" fill="var(--gold)" />
      </g>
      <g id="carried-peg" opacity="0">
        <circle r="21" fill="var(--orange)" filter="url(#peg-shadow)" />
        <circle r="6" fill="rgba(255,255,255,.25)" />
      </g>

      <!-- Même main anatomique validée, utilisée en gauche et en droite. -->

  </main>

  <script>
    (() => {
      "use strict";

      const SCALE = .76;
      const colors = {
        orange: "#f29a69",
        cream: "#f6eee5",
        sage: "#89a48e",
        gold: "#f2c36f"
      };
      const sources = {
        orange: { x: 970, y: 184 },
        cream: { x: 1080, y: 184 },
        sage: { x: 970, y: 316 },
        gold: { x: 1080, y: 316 }
      };
      const guesses = [
        ["orange", "sage", "gold", "cream"],
        ["orange", "cream", "gold", "sage"],
        ["orange", "cream", "sage", "gold"]
      ];
      const slots = [445, 525, 605, 685];
      const rows = [293, 410, 527];
      const localGrip = {
        left: { x: 180, y: 69 },
        right: { x: 58, y: 69 }
      };
      const grip = {
        left: { x: localGrip.left.x * SCALE, y: localGrip.left.y * SCALE },
        right: { x: localGrip.right.x * SCALE, y: localGrip.right.y * SCALE }
      };
      const rest = {
        left: { x: -44, y: 476 },
        right: { x: 1050, y: 474 }
      };

      const hands = {
        left: document.getElementById("left-hand"),
        right: document.getElementById("right-hand")
      };
      const current = {
        left: { ...rest.left },
        right: { ...rest.right }
      };
      const placed = document.getElementById("placed-pegs");
      const carriedPeg = document.getElementById("carried-peg");
      const carriedPegCore = carriedPeg.querySelector("circle");
      const carriedCode = document.getElementById("carried-code");
      const sourceStrip = document.getElementById("code-strip-source");
      const secretCode = document.getElementById("secret-code");
      const cover = document.getElementById("secret-cover");
      const scanLine = document.getElementById("scan-line");
      const victoryHalo = document.getElementById("victory-halo");
      const stage = document.getElementById("stage");
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let runId = 0;

      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const lerp = (a, b, t) => a + (b - a) * t;
      const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function tween(duration, draw, id) {
        return new Promise(resolve => {
          const started = performance.now();
          function frame(now) {
            if (id !== runId) return resolve(false);
            const raw = Math.min(1, (now - started) / duration);
            draw(ease(raw), raw);
            if (raw < 1) requestAnimationFrame(frame);
            else resolve(true);
          }
          requestAnimationFrame(frame);
        });
      }

      function setHand(side, origin, scale = SCALE, rotation = 0) {
        hands[side].setAttribute(
          "transform",
          `translate(${origin.x.toFixed(2)} ${origin.y.toFixed(2)}) scale(${scale.toFixed(3)}) rotate(${rotation.toFixed(2)} ${localGrip[side].x} ${localGrip[side].y})`
        );
        current[side] = { ...origin };
      }

      function handOriginFor(side, worldPoint) {
        return {
          x: worldPoint.x - grip[side].x,
          y: worldPoint.y - grip[side].y
        };
      }

      function gripWorld(side) {
        return {
          x: current[side].x + grip[side].x,
          y: current[side].y + grip[side].y
        };
      }

      function setMovingObject(node, point, scale = 1, rotation = 0) {
        node.setAttribute(
          "transform",
          `translate(${point.x.toFixed(2)} ${point.y.toFixed(2)}) rotate(${rotation.toFixed(2)}) scale(${scale.toFixed(3)})`
        );
      }

      async function moveHand(side, worldPoint, duration, id, arc = 24) {
        const from = { ...current[side] };
        const to = handOriginFor(side, worldPoint);
        return tween(duration, t => {
          setHand(side, {
            x: lerp(from.x, to.x, t),
            y: lerp(from.y, to.y, t) - Math.sin(Math.PI * t) * arc
          }, SCALE, (side === "right" ? -1 : 1) * Math.sin(Math.PI * t) * 1.6);
        }, id);
      }

      async function carry(side, node, worldPoint, duration, id, arc = 42) {
        const fromOrigin = { ...current[side] };
        const toOrigin = handOriginFor(side, worldPoint);
        return tween(duration, (t, raw) => {
          const origin = {
            x: lerp(fromOrigin.x, toOrigin.x, t),
            y: lerp(fromOrigin.y, toOrigin.y, t) - Math.sin(Math.PI * t) * arc
          };
          setHand(side, origin, SCALE * (1 - Math.sin(Math.PI * raw) * .012));
          setMovingObject(node, {
            x: origin.x + grip[side].x,
            y: origin.y + grip[side].y
          }, 1, (side === "right" ? 1 : -1) * Math.sin(Math.PI * t) * 1.8);
        }, id);
      }

      function animateAttribute(node, keyframes, options) {
        const animation = node.animate(keyframes, options);
        return animation.finished.catch(() => undefined);
      }

      async function pulseSource(color) {
        const node = document.querySelector(`.source[data-color="${color}"] .source-core`);
        await animateAttribute(node,
          [{ transform: "scale(1)" }, { transform: "scale(.84)" }, { transform: "scale(1)" }],
          { duration: 180, easing: "cubic-bezier(.4,0,.2,1)" }
        );
      }

      function createPlacedPeg(row, column, color) {
        const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("cx", slots[column]);
        circle.setAttribute("cy", rows[row]);
        circle.setAttribute("r", "21");
        circle.setAttribute("fill", colors[color]);
        circle.setAttribute("filter", "url(#peg-shadow)");
        circle.style.transformBox = "fill-box";
        circle.style.transformOrigin = "center";
        placed.appendChild(circle);
        circle.animate(
          [{ transform: "scale(.2)", opacity: 0 }, { transform: "scale(1.12)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }],
          { duration: 240, easing: "cubic-bezier(.25,.8,.3,1)" }
        );
        return circle;
      }

      async function placePeg(row, column, color, id) {
        const source = sources[color];
        await moveHand("right", source, 320, id, 17);
        if (id !== runId) return;
        await Promise.all([
          pulseSource(color),
          tween(180, (_t, raw) => {
            const pressure = Math.sin(Math.PI * raw);
            setHand("right", handOriginFor("right", source), SCALE * (1 - pressure * .022));
          }, id)
        ]);
        if (id !== runId) return;

        carriedPegCore.setAttribute("fill", colors[color]);
        carriedPeg.setAttribute("opacity", "1");
        setMovingObject(carriedPeg, source, .92);
        const destination = { x: slots[column], y: rows[row] };
        await carry("right", carriedPeg, destination, 390, id, 39);
        if (id !== runId) return;

        await tween(130, (_t, raw) => {
          const pressure = Math.sin(Math.PI * raw);
          setHand("right", handOriginFor("right", destination), SCALE * (1 - pressure * .018));
          setMovingObject(carriedPeg, destination, .92 + pressure * .05);
        }, id);
        carriedPeg.setAttribute("opacity", "0");
        createPlacedPeg(row, column, color);
        await sleep(55);
      }

      async function evaluateRow(row, id) {
        const y = rows[row];
        scanLine.setAttribute("d", `M408 ${y - 39} H792`);
        scanLine.setAttribute("opacity", "1");
        scanLine.setAttribute("stroke-dasharray", "384");
        scanLine.setAttribute("stroke-dashoffset", "384");

        await tween(480, (_t, raw) => {
          scanLine.setAttribute("stroke-dashoffset", (384 * (1 - raw)).toFixed(2));
        }, id);
        scanLine.setAttribute("opacity", "0");

        const feedback = document.getElementById(`feedback-${row}`);
        feedback.setAttribute("opacity", "1");
        feedback.animate(
          [{ transform: "scale(.35)", opacity: 0 }, { transform: "scale(1.08)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }],
          { duration: 360, easing: "cubic-bezier(.2,.8,.2,1)" }
        );
        await sleep(row === 2 ? 280 : 560);
      }

      async function setSecret(id) {
        const source = { x: 163, y: 164 };
        const target = { x: 600, y: 164 };
        await moveHand("left", source, 420, id, 25);
        if (id !== runId) return;
        sourceStrip.animate(
          [{ transform: "scale(1)" }, { transform: "scale(.96)" }, { transform: "scale(1)" }],
          { duration: 190, easing: "ease-in-out" }
        );
        await sleep(140);
        sourceStrip.setAttribute("opacity", "0");
        carriedCode.setAttribute("opacity", "1");
        setMovingObject(carriedCode, source);
        await carry("left", carriedCode, target, 620, id, 70);
        if (id !== runId) return;

        carriedCode.setAttribute("opacity", "0");
        secretCode.setAttribute("opacity", "1");
        secretCode.animate(
          [{ transform: "scale(.94)", opacity: .5 }, { transform: "scale(1.04)", opacity: 1 }, { transform: "scale(1)", opacity: 1 }],
          { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" }
        );
        await moveHand("left", { x: -90, y: 600 }, 520, id, 24);
        await tween(480, t => {
          cover.setAttribute("transform", `translate(0 ${lerp(-134, 0, t).toFixed(2)})`);
        }, id);
        await sleep(280);
      }

      async function celebrate(id) {
        await tween(480, t => {
          cover.setAttribute("transform", `translate(0 ${lerp(0, -134, t).toFixed(2)})`);
        }, id);
        if (id !== runId) return;
        victoryHalo.setAttribute("opacity", "1");
        victoryHalo.animate(
          [
            { transform: "scale(.94)", opacity: 0 },
            { transform: "scale(1.035)", opacity: 1 },
            { transform: "scale(1)", opacity: .9 }
          ],
          { duration: 620, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }
        );
        secretCode.animate(
          [{ filter: "brightness(1)" }, { filter: "brightness(1.32)" }, { filter: "brightness(1)" }],
          { duration: 850, iterations: 2, easing: "ease-in-out" }
        );
        await moveHand("right", { x: 1035, y: 560 }, 560, id, 22);
        await sleep(2100);
      }

      function reset() {
        document.querySelector("svg").style.opacity = "1";
        placed.replaceChildren();
        sourceStrip.setAttribute("opacity", "1");
        secretCode.setAttribute("opacity", "0");
        carriedPeg.setAttribute("opacity", "0");
        carriedCode.setAttribute("opacity", "0");
        cover.setAttribute("transform", "translate(0 -134)");
        scanLine.setAttribute("opacity", "0");
        victoryHalo.setAttribute("opacity", "0");
        for (let row = 0; row < 3; row += 1) {
          document.getElementById(`feedback-${row}`).setAttribute("opacity", "0");
        }
        setHand("left", rest.left);
        setHand("right", rest.right);
      }

      function showReducedMotionFinal() {
        reset();
        secretCode.setAttribute("opacity", "1");
        cover.setAttribute("transform", "translate(0 -134)");
        guesses[2].forEach((color, column) => createPlacedPeg(2, column, color));
        document.getElementById("feedback-2").setAttribute("opacity", "1");
        victoryHalo.setAttribute("opacity", "1");
      }

      async function play() {
        const id = ++runId;
        reset();
        if (reduceMotion) return showReducedMotionFinal();

        await sleep(260);
        await setSecret(id);
        if (id !== runId) return;

        for (let row = 0; row < guesses.length; row += 1) {
          for (let column = 0; column < guesses[row].length; column += 1) {
            await placePeg(row, column, guesses[row][column], id);
            if (id !== runId) return;
          }
          await moveHand("right", { x: 948, y: rows[row] + 18 }, 280, id, 12);
          await evaluateRow(row, id);
          if (id !== runId) return;
        }

        await celebrate(id);
        if (id !== runId) return;
        await tween(360, t => {
          document.querySelector("svg").style.opacity = String(1 - t);
        }, id);
        if (id !== runId) return;
        reset();
        document.querySelector("svg").style.opacity = "1";
        play();
      }

      stage.addEventListener("click", () => play());
      play();
    })();
  </script>
</body>
</html>
