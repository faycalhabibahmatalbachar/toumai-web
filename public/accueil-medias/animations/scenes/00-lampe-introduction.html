<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toumaï — Introduction</title>
  <link rel="stylesheet" href="../commun/scene.css" />
  <style>
    /* La poussière dans le faisceau. Elle ne se remarque pas et c'est le but :
     * un cône de lumière parfaitement vide se lit comme un aplat de couleur,
     * un cône habité se lit comme de l'air. Douze cercles, aucune image. */
    /* Le faisceau AJOUTE de la lumiere au lieu de deposer un voile : sans
     * « screen », le meme cone vire au gris-vert sur le mur sombre. */
    .faisceau { mix-blend-mode: screen; }

    /* Le point du fil d etat respire : c est le seul mouvement qui reste
     * quand la scene tient sa pose, et il suffit a dire que ca tourne. */
    #etat-point { animation: pouls 2.4s ease-in-out infinite; transform-origin: 70px 63px; }
    @keyframes pouls {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: .45; transform: scale(.82); }
    }

    .poussiere {
      fill: var(--or);
      opacity: .5;
      animation: derive 9s linear infinite;
    }
    .poussiere:nth-child(2n) { animation-duration: 12s; animation-delay: -3s; }
    .poussiere:nth-child(3n) { animation-duration: 15s; animation-delay: -7s; opacity: .32; }

    @keyframes derive {
      0%   { transform: translate(0, 0); }
      50%  { transform: translate(14px, -22px); }
      100% { transform: translate(0, 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .poussiere, #etat-point { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <svg viewBox="0 0 1200 720" role="img" aria-labelledby="titre-scene desc-scene">
      <title id="titre-scene">Toumaï s'allume, ouvre un livre et y écrit son introduction</title>
      <desc id="desc-scene">
        Une pièce sombre. Une table, une chaise, un livre fermé et un verre d'eau.
        Une main tire le cordon d'une lampe suspendue : la lumière se pose sur la
        table. La main ouvre alors le livre, et le titre « Introduction — Toumaï 5 »
        s'écrit sur la page, lettre après lettre, suivi de deux lignes de texte.
      </desc>

      <defs>
        <linearGradient id="bois" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#7a4a30" />
          <stop offset="1" stop-color="#5e3721" />
        </linearGradient>
        <linearGradient id="bois-tranche" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4d2c1a" />
          <stop offset="1" stop-color="#3a2013" />
        </linearGradient>
        <linearGradient id="abat-jour" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e0876a" />
          <stop offset="1" stop-color="#b04f34" />
        </linearGradient>
        <linearGradient id="couv" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#c9603f" />
          <stop offset="1" stop-color="#a8482c" />
        </linearGradient>
        <linearGradient id="eau" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#cfe4e6" stop-opacity=".92" />
          <stop offset="1" stop-color="#8fb9bf" stop-opacity=".86" />
        </linearGradient>

        <radialGradient id="flaque" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffd9a3" stop-opacity=".92" />
          <stop offset="55%" stop-color="#ffc178" stop-opacity=".42" />
          <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="faisceau" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffcf94" stop-opacity=".62" />
          <stop offset="62%" stop-color="#ffb265" stop-opacity=".22" />
          <stop offset="100%" stop-color="#ff9d4d" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="gouttiere-gauche" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7a6247" stop-opacity="0" />
          <stop offset="100%" stop-color="#6b5335" stop-opacity=".34" />
        </linearGradient>
        <linearGradient id="gouttiere-droite" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6b5335" stop-opacity=".34" />
          <stop offset="100%" stop-color="#7a6247" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="vignette" cx="50%" cy="46%" r="62%">
          <stop offset="55%" stop-color="#000" stop-opacity="0" />
          <stop offset="100%" stop-color="#000" stop-opacity=".72" />
        </radialGradient>

        <filter id="flou-cone" x="-14%" y="-14%" width="128%" height="128%">
          <feGaussianBlur stdDeviation="13" />
        </filter>
        <filter id="lueur" x="-120%" y="-120%" width="340%" height="340%">
          <feDropShadow dx="0" dy="0" stdDeviation="26" flood-color="#ffcf8a" flood-opacity=".95" />
        </filter>
        <filter id="ombre-douce" x="-40%" y="-40%" width="180%" height="200%">
          <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#160c06" flood-opacity=".55" />
        </filter>
        <filter id="ombre-fine" x="-40%" y="-40%" width="180%" height="200%">
          <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#160c06" flood-opacity=".45" />
        </filter>

        <clipPath id="clip-faisceau">
          <polygon points="510,190 690,190 1010,624 190,624" />
        </clipPath>
        <clipPath id="clip-page-droite">
          <rect x="602" y="330" width="258" height="260" rx="6" />
        </clipPath>
      </defs>

      <!-- Le fond de la pièce -->
      <rect x="0" y="0" width="1200" height="720" fill="#171210" />
      <rect x="0" y="0" width="1200" height="300" fill="#12100e" />

      <!-- La chaise, derrière la table -->
      <g id="chaise" opacity=".72">
        <rect x="196" y="150" width="18" height="150" rx="8" fill="url(#bois-tranche)" />
        <rect x="428" y="150" width="18" height="150" rx="8" fill="url(#bois-tranche)" />
        <rect x="196" y="168" width="250" height="20" rx="10" fill="url(#bois)" />
        <rect x="196" y="212" width="250" height="20" rx="10" fill="url(#bois)" />
        <rect x="196" y="256" width="250" height="20" rx="10" fill="url(#bois)" />
      </g>

      <!-- La table -->
      <g filter="url(#ombre-douce)">
        <rect x="120" y="290" width="960" height="330" rx="44" fill="url(#bois)" />
        <rect x="120" y="596" width="960" height="34" rx="17" fill="url(#bois-tranche)" />
        <rect x="216" y="630" width="26" height="86" rx="13" fill="url(#bois-tranche)" />
        <rect x="958" y="630" width="26" height="86" rx="13" fill="url(#bois-tranche)" />
      </g>

      <!-- La lumière : le faisceau, la flaque sur la table, la poussière -->
      <g id="lumiere" opacity="0">
        <polygon class="faisceau" points="510,190 690,190 1010,624 190,624"
                 fill="url(#faisceau)" filter="url(#flou-cone)" />
        <ellipse cx="600" cy="470" rx="360" ry="152" fill="url(#flaque)" />
        <g id="poussieres" clip-path="url(#clip-faisceau)">
          <circle class="poussiere" cx="470" cy="330" r="2.4" />
          <circle class="poussiere" cx="560" cy="420" r="1.8" />
          <circle class="poussiere" cx="648" cy="286" r="2.1" />
          <circle class="poussiere" cx="712" cy="404" r="1.6" />
          <circle class="poussiere" cx="392" cy="470" r="2.6" />
          <circle class="poussiere" cx="826" cy="356" r="2" />
          <circle class="poussiere" cx="540" cy="556" r="1.7" />
          <circle class="poussiere" cx="880" cy="512" r="2.3" />
          <circle class="poussiere" cx="330" cy="392" r="1.9" />
          <circle class="poussiere" cx="742" cy="586" r="2.2" />
          <circle class="poussiere" cx="622" cy="246" r="1.5" />
          <circle class="poussiere" cx="466" cy="604" r="1.8" />
        </g>
      </g>

      <!-- La lampe suspendue -->
      <g id="lampe">
        <line x1="600" y1="0" x2="600" y2="88" stroke="#2b211b" stroke-width="5" />
        <path d="M600 88 L706 186 L494 186 Z" fill="url(#abat-jour)" />
        <ellipse cx="600" cy="186" rx="106" ry="15" fill="#8f3d25" />
        <circle id="halo" cx="600" cy="200" r="16" fill="#ffe7bd" filter="url(#lueur)" opacity="0" />
        <circle id="ampoule" cx="600" cy="200" r="15" fill="#3a2c22" />
        <!-- Le cordon : c'est lui qu'on tire -->
        <g id="cordon">
          <line x1="688" y1="182" x2="688" y2="286" stroke="#c9a06f" stroke-width="3.2" />
          <circle cx="688" cy="290" r="9" fill="#c9a06f" />
          <circle cx="688" cy="290" r="4" fill="#8f6d45" />
        </g>
      </g>

      <!-- Le verre d'eau -->
      <g id="verre" filter="url(#ombre-fine)">
        <ellipse id="reflet-verre" cx="946" cy="512" rx="52" ry="14" fill="#ffd9a3" opacity="0" />
        <path d="M914 372 L978 372 L970 496 Q946 508 922 496 Z" fill="#dff0f2" opacity=".22" />
        <path d="M919 406 L973 406 L970 496 Q946 508 922 496 Z" fill="url(#eau)" />
        <ellipse cx="946" cy="406" rx="27" ry="6" fill="#eaf6f7" opacity=".85" />
        <path d="M914 372 L978 372 L970 496 Q946 508 922 496 Z" fill="none"
              stroke="#eaf6f7" stroke-opacity=".55" stroke-width="2.4" />
        <path id="eclat-verre" d="M925 386 L931 386 L927 486 L921 486 Z" fill="#fff" opacity="0" />
      </g>

      <!-- Le livre -->
      <g id="livre">
        <ellipse id="ombre-livre" cx="600" cy="598" rx="268" ry="17" fill="#0d0705" opacity="0" />

        <!-- Les deux pages, sous la couverture -->
        <g id="pages" opacity="0">
          <rect x="340" y="330" width="260" height="260" rx="6" fill="#f4ead9" />
          <rect x="602" y="330" width="258" height="260" rx="6" fill="#fdf7ec" />
          <path d="M600 330 Q592 460 600 590" fill="none" stroke="#d9c9b2" stroke-width="3" />
          <rect x="340" y="330" width="520" height="260" rx="6" fill="none"
                stroke="#e3d5c0" stroke-width="2" />

          
          <!-- La page de droite : c'est là que ça s'écrit -->
          <g clip-path="url(#clip-page-droite)">
            <text id="sur-titre" x="632" y="404" fill="#b95438"
                  font-family="Inter, ui-sans-serif, system-ui, sans-serif"
                  font-size="17" font-weight="700" letter-spacing="4.6"></text>
            <line id="filet" x1="632" y1="422" x2="632" y2="422"
                  stroke="#dcc8ab" stroke-width="2" />
            <text id="titre" x="632" y="486" fill="#1d1712"
                  font-family="Georgia, 'Times New Roman', serif"
                  font-size="52" letter-spacing="-1.8"></text>
            <text id="ligne-1" x="632" y="532" fill="#6b5b48"
                  font-family="Inter, ui-sans-serif, system-ui, sans-serif"
                  font-size="17"></text>
            <text id="ligne-2" x="632" y="558" fill="#6b5b48"
                  font-family="Inter, ui-sans-serif, system-ui, sans-serif"
                  font-size="17"></text>
          </g>
        </g>

        <!-- La couverture. Elle pivote autour du dos, en x = 600.
             Face visible tant que l'échelle horizontale est positive, dos
             au-delà : c'est ce basculement qui fait la page qui se retourne. -->
        <g id="couverture">
          <g id="couverture-face">
            <rect x="0" y="0" width="260" height="260" rx="8" fill="url(#couv)" />
            <rect x="0" y="0" width="13" height="260" rx="4" fill="#8f3d25" />
            <rect x="42" y="44" width="176" height="3" rx="1.5" fill="#f7d9c9" opacity=".55" />
            <rect x="42" y="212" width="108" height="3" rx="1.5" fill="#f7d9c9" opacity=".4" />
            <circle cx="130" cy="128" r="34" fill="none" stroke="#f7d9c9" stroke-opacity=".5" stroke-width="3" />
            <text x="130" y="142" text-anchor="middle" fill="#f9e6da"
                  font-family="Georgia, 'Times New Roman', serif" font-size="34">T</text>
          </g>
          <g id="couverture-dos" opacity="0">
            <rect x="0" y="0" width="260" height="260" rx="8" fill="#f4ead9" />
            <rect x="247" y="0" width="13" height="260" rx="4" fill="#e0d0ba" />
            <!-- Ce qui a deja ete ecrit. Ces lignes vivaient sur la page
                 de gauche, ou la couverture rabattue les recouvrait
                 entierement : elles etaient dessinees et invisibles.
                 Elles sont ici, au dos de la couverture, c est-a-dire a
                 l endroit qu on regarde une fois le livre ouvert. -->
            <g opacity=".42" fill="none" stroke="#c1ad91" stroke-width="3" stroke-linecap="round">
              <line x1="42" y1="64" x2="218" y2="64" />
              <line x1="42" y1="92" x2="218" y2="92" />
              <line x1="42" y1="120" x2="176" y2="120" />
              <line x1="42" y1="164" x2="218" y2="164" />
              <line x1="42" y1="192" x2="218" y2="192" />
              <line x1="42" y1="220" x2="128" y2="220" />
            </g>
          </g>
        </g>
      </g>

      <!-- La gouttiere : l ombre du pli central. C est ce degrade, et rien
           d autre, qui fait la difference entre deux feuilles posees a plat
           et un livre relie. -->
      <g id="gouttiere" opacity="0">
        <rect x="556" y="332" width="44" height="256" fill="url(#gouttiere-gauche)" />
        <rect x="602" y="332" width="44" height="256" fill="url(#gouttiere-droite)" />
      </g>

      <!-- La main -->
      <g id="main" class="main">
        <g transform="translate(238 0) scale(-1 1)">
          <image x="0" y="0" width="238" height="275" preserveAspectRatio="none"
                 href="../commun/mains/main-1.webp" />
        </g>
      </g>

      <!-- Le voile de nuit : il se retire quand la lampe s'allume -->
      <rect id="nuit" x="0" y="0" width="1200" height="720" fill="#0b0806" opacity=".88" />
      <rect x="0" y="0" width="1200" height="720" fill="url(#vignette)" pointer-events="none" />

      <!-- Le fil d'état : ce que la scène est en train de faire, en clair -->
      <g id="etat" opacity="0">
        <rect class="etat-fond" x="40" y="40" width="248" height="46" rx="23" />
        <circle id="etat-point" cx="70" cy="63" r="5" fill="#d97857" />
        <text id="etat-texte" class="etat" x="88" y="69"></text>
      </g>
    </svg>
  </main>

  <script src="../commun/scene.js"></script>
  <script>
    (() => {
      "use strict";

      const S = window.Scene;

      const cordon = S.el("cordon");
      const halo = S.el("halo");
      const ampoule = S.el("ampoule");
      const lumiere = S.el("lumiere");
      const nuit = S.el("nuit");
      const chaise = S.el("chaise");
      const couverture = S.el("couverture");
      const face = S.el("couverture-face");
      const dos = S.el("couverture-dos");
      const pages = S.el("pages");
      const gouttiere = S.el("gouttiere");
      const ombreLivre = S.el("ombre-livre");
      const refletVerre = S.el("reflet-verre");
      const eclatVerre = S.el("eclat-verre");
      const etat = S.el("etat");
      const etatTexte = S.el("etat-texte");
      const filet = S.el("filet");

      const surTitre = S.el("sur-titre");
      const titre = S.el("titre");
      const ligne1 = S.el("ligne-1");
      const ligne2 = S.el("ligne-2");

      /** Le dos du livre : tout pivote autour de lui. */
      const DOS_X = 600;
      const LIVRE_Y = 330;

      /** La bille du cordon, au repos et tirée à fond. */
      const BILLE = { x: 688, y: 290 };
      const BILLE_TIREE = { x: 688, y: 344 };

      const main = S.Main({
        id: "main",
        echelle: 0.84,
        // La main est retournée : les doigts sont à gauche de l'image.
        grip: { x: 58, y: 69 },
        repos: { x: 1140, y: 470 },
      });

      function dire(texte) {
        etatTexte.textContent = texte;
      }

      function cordonA(y) {
        const ligne = cordon.querySelector("line");
        const billes = cordon.querySelectorAll("circle");
        ligne.setAttribute("y2", String(y - 4));
        billes.forEach((c) => c.setAttribute("cy", String(y)));
      }

      /** La couverture, entre 1 (fermée) et -1 (rabattue à gauche). */
      function couvertureA(sx) {
        // Un livre qui s'ouvre se bombe légèrement : sans ce gonflement, la
        // couverture a l'air d'une carte qu'on retourne, pas d'un carton relié.
        const bombe = 1 + 0.05 * Math.sin(Math.PI * Math.min(1, Math.abs(sx - 1) / 2));
        couverture.setAttribute(
          "transform",
          "translate(" + DOS_X + " " + LIVRE_Y + ") scale(" + sx.toFixed(4) + " " + bombe.toFixed(4) + ")"
        );
        const ouverte = sx < 0;
        S.opacite(face, ouverte ? 0 : 1);
        S.opacite(dos, ouverte ? 1 : 0);
      }

      function preparer() {
        cordonA(BILLE.y);
        couvertureA(1);
        S.opacite(lumiere, 0);
        S.opacite(halo, 0);
        ampoule.setAttribute("fill", "#3a2c22");
        S.opacite(nuit, 0.88);
        S.opacite(chaise, 0.72);
        S.opacite(pages, 0);
        S.opacite(gouttiere, 0);
        S.opacite(ombreLivre, 0);
        S.opacite(refletVerre, 0);
        S.opacite(eclatVerre, 0);
        S.opacite(etat, 0);
        filet.setAttribute("x2", "632");
        surTitre.textContent = "";
        titre.textContent = "";
        ligne1.textContent = "";
        ligne2.textContent = "";
        dire("");
        main.poser(main.pourToucher({ x: 1240, y: 500 }));
      }

      /** L'état final, pour qui a demandé moins de mouvement. */
      function finFixe() {
        cordonA(BILLE.y);
        couvertureA(-1);
        S.opacite(lumiere, 1);
        S.opacite(halo, 1);
        ampoule.setAttribute("fill", "#ffe7bd");
        S.opacite(nuit, 0.16);
        S.opacite(chaise, 1);
        S.opacite(pages, 1);
        S.opacite(gouttiere, 1);
        S.opacite(ombreLivre, 0.5);
        S.opacite(refletVerre, 0.55);
        S.opacite(etat, 1);
        filet.setAttribute("x2", "764");
        surTitre.textContent = "INTRODUCTION";
        titre.textContent = "Toumaï 5";
        ligne1.textContent = "Un modèle qui réfléchit";
        ligne2.textContent = "avant de répondre.";
        dire("Toumaï 5 · raisonnement");
        main.poser(main.pourToucher({ x: 1240, y: 500 }));
      }

      async function allumer() {
        dire("Éclairer");
        await S.tween(420, (t) => S.opacite(etat, t));

        await main.aller(BILLE, 720, 34);
        await main.serrer(160);

        // La traction : sèche à la descente, élastique au retour.
        await S.tween(240, (t) => {
          const y = S.entre(BILLE.y, BILLE_TIREE.y, t);
          cordonA(y);
          main.poser(main.pourToucher({ x: BILLE.x, y: y }));
        }, S.courbes.freine);

        // Le clic. La lumière ne monte pas en fondu : elle s'établit d'un coup,
        // puis se stabilise. Une lampe qui s'allume progressivement se lit
        // comme un variateur, pas comme un interrupteur.
        ampoule.setAttribute("fill", "#ffe7bd");
        const retour = S.tween(520, (t) => {
          const y = S.entre(BILLE_TIREE.y, BILLE.y, t);
          cordonA(y);
          main.poser(main.pourToucher({ x: BILLE.x, y: y }));
        }, S.courbes.ressort);

        await S.tween(340, (t) => {
          const eclat = Math.min(1, t * 1.6);
          S.opacite(halo, eclat);
          S.opacite(lumiere, eclat);
          S.opacite(nuit, S.entre(0.88, 0.16, t));
          S.opacite(chaise, S.entre(0.72, 1, t));
          S.opacite(ombreLivre, t * 0.5);
          S.opacite(refletVerre, t * 0.55);
        }, S.courbes.freine);

        await retour;

        // L'éclat qui traverse le verre, une fois la lumière posée.
        await S.tween(560, (t) => S.opacite(eclatVerre, Math.sin(Math.PI * t) * 0.5));
        await main.rentrer(560);
      }

      async function ouvrirLeLivre() {
        dire("Ouvrir");

        const bord = { x: DOS_X + 254, y: 470 };
        await main.aller(bord, 640, 30);
        await main.serrer(150);

        // La couverture passe de 1 à -1 ; la main l'accompagne jusqu'au bout
        // de son arc, puis la lâche. C'est l'accompagnement qui fait croire
        // que c'est la main qui ouvre, et non le livre qui s'ouvre seul.
        await S.tween(900, (t) => {
          const sx = S.entre(1, -1, t);
          couvertureA(sx);
          const bordX = DOS_X + 254 * sx;
          const leve = Math.sin(Math.PI * t) * 54;
          main.poser(main.pourToucher({ x: bordX, y: 470 - leve }));
          if (t > 0.52) {
            const apparition = Math.min(1, (t - 0.52) / 0.3);
            S.opacite(pages, apparition);
            S.opacite(gouttiere, apparition);
          }
        });

        // Le petit rebond du carton qui retombe sur la table.
        await S.tween(220, (t) => couvertureA(-1 - 0.03 * Math.sin(Math.PI * t)));
        await main.rentrer(620);
      }

      async function ecrireLaPage() {
        dire("Écrire");
        await S.tween(360, (t) => filet.setAttribute("x2", String(S.entre(632, 764, t))));
        await S.ecrire(surTitre, "INTRODUCTION", 42);
        await S.attendre(220);
        await S.ecrire(titre, "Toumaï 5", 74);
        await S.attendre(320);
        await S.ecrire(ligne1, "Un modèle qui réfléchit", 26);
        await S.ecrire(ligne2, "avant de répondre.", 26);
      }

      const scene = S.jouer({
        preparer,
        finFixe,
        pause: 2600,
        async sequence(annulee) {
          await S.attendre(520);
          await allumer();
          if (annulee()) return;
          await S.attendre(260);
          await ouvrirLeLivre();
          if (annulee()) return;
          await S.attendre(340);
          await ecrireLaPage();
          if (annulee()) return;

          dire("Toumaï 5 · raisonnement");
          await S.attendre(1600);

          // Extinction : on referme sur le noir, et la boucle recommence.
          await S.tween(760, (t) => {
            S.opacite(lumiere, 1 - t);
            S.opacite(halo, 1 - t);
            S.opacite(nuit, S.entre(0.16, 0.88, t));
            S.opacite(pages, 1 - t);
            S.opacite(gouttiere, 1 - t);
            S.opacite(etat, 1 - t);
            S.opacite(ombreLivre, 0.5 * (1 - t));
            S.opacite(refletVerre, 0.55 * (1 - t));
          });
        },
      });

      // Un clic relance la scène depuis le noir. Le cadre de l'accueil neutralise
      // les clics ; ouverte seule, la page reste rejouable.
      S.el("scene").addEventListener("click", () => scene.relancer());
      scene.tour();
    })();
  </script>
